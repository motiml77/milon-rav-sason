function goToEntryByEntryId(eid){
  const found = findEntry(eid);
  if(found) goToEntry(found.topic.id, found.entry.id);
}

// ════════════════════════════════════════════════════════════════
//  ─── תצוגת תוצאות החיפוש ───
// ════════════════════════════════════════════════════════════════
const SEARCH_PAGE_SIZE = 20;
let searchOptAlsoContent = true;
let currentSearchQuery   = "";
let currentSearchResults = [];
let currentSearchPage    = 1;
let currentMatchTokens   = null;   // Set של הטוקנים שהתאימו — משמש להדגשה
let currentSearchNote    = null;   // 'toofar' וכו' — להסבר במסך ריק
let currentResolved      = null;   // תוצאת פענוח מילות החיפוש (לחישוב ההגדרה המתאימה)

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// טוקניזציה ששומרת מיקומים — נדרשת להדגשה מדויקת ולחיתוך קטע סביב ההתאמה
function tokenizeWithPos(s){
  const out = [];
  if(!s) return out;
  const n = s.length;
  let i = 0;
  while(i < n){
    const c = s.charCodeAt(i);
    if(!isWordCode(c)){ i++; continue; }
    let j = i + 1;
    while(j < n && isWordCode(s.charCodeAt(j))) j++;
    let t = s.slice(i, j);
    if(NIKUD_RE.test(t)) t = t.replace(NIKUD_ALL, '');
    t = t.replace(SOF_RE, ch => SOF_MAP[ch]).toLowerCase();
    out.push({ tok: t, start: i, end: j });
    i = j;
  }
  return out;
}

// אוסף את כל צורות המילים שהתאימו בפועל — בסיס להדגשה עקבית עם ההתאמה
// מחזיר Map: טוקן → אינדקס מילת החיפוש שהוא התאים לה.
// Map תומך ב-has()/size, כך ש-highlightTokens ממשיך לעבוד כמו קודם;
// האינדקס נחוץ ל-makeSnippet כדי לדעת *כמה* מילות חיפוש שונות יש בכל חלון.
function collectMatchTokens(ix, resolved){
  const map = new Map();
  if(!ix || !resolved) return map;
  for(let wi = 0; wi < resolved.length; wi++){
    for(const id of resolved[wi].qmap.keys()){
      const t = ix.vocabList[id];
      if(t && !map.has(t)) map.set(t, wi);
    }
  }
  return map;
}

function highlightTokens(text, matchTokens){
  if(!text) return '';
  if(!matchTokens || !matchTokens.size) return escapeHtml(text);
  const toks = tokenizeWithPos(text);
  let out = '', last = 0;
  for(const t of toks){
    if(!matchTokens.has(t.tok)) continue;
    out += escapeHtml(text.slice(last, t.start));
    out += '<span class="search-hl">' + escapeHtml(text.slice(t.start, t.end)) + '</span>';
    last = t.end;
  }
  out += escapeHtml(text.slice(last));
  return out;
}

// קטע תצוגה שממורכז סביב ההתאמה הראשונה.
// קודם הוצגו תמיד 350 התווים הראשונים של ההגדרה — ב-28% מהמקרים
// מילת החיפוש כלל לא הופיעה בתצוגה המקדימה.
function makeSnippet(text, matchTokens, maxLen){
  if(!text) return '';
  maxLen = maxLen || 300;
  let hit = -1;
  if(matchTokens && matchTokens.size){
    // אסוף כל מופע התאמה עם מזהה מילת החיפוש שלו
    const hits = [];
    for(const t of tokenizeWithPos(text)){
      const wi = matchTokens.get ? matchTokens.get(t.tok) : (matchTokens.has(t.tok) ? 0 : undefined);
      if(wi !== undefined) hits.push({ at: t.start, wi: wi });
    }
    if(hits.length === 1){
      hit = hits[0].at;
    }else if(hits.length > 1){
      // בחר את החלון שמכסה את המספר הגדול ביותר של מילות חיפוש *שונות*,
      // ובשוויון — את הצמוד ביותר. בלי זה שאילתה כמו "נשמות דקרי" הייתה
      // ממורכזת על מופע מקרי של "נשמות" בתחילת ההגדרה, וההתאמה האמיתית
      // (הצירוף המלא, עמוק בתוך ההגדרה) לא הייתה נראית בכלל.
      const win = Math.round(maxLen * 0.8);
      let bestI = 0, bestCov = -1, bestSpan = Infinity;
      for(let i = 0; i < hits.length; i++){
        const seen = new Set();
        let j = i, last = hits[i].at;
        while(j < hits.length && hits[j].at - hits[i].at <= win){
          seen.add(hits[j].wi); last = hits[j].at; j++;
        }
        const cov = seen.size, span = last - hits[i].at;
        if(cov > bestCov || (cov === bestCov && span < bestSpan)){
          bestCov = cov; bestSpan = span; bestI = i;
        }
      }
      // מרכז את הקטע על אמצע החלון שנבחר
      hit = hits[bestI].at + Math.round(bestSpan / 2);
    }
  }
  if(hit < 0){
    return text.length > maxLen ? text.slice(0, maxLen).trimEnd() + '…' : text;
  }
  let start = Math.max(0, hit - Math.round(maxLen * 0.5));
  if(start > 0){
    const sp = text.indexOf(' ', start);
    if(sp >= 0 && sp < start + 40) start = sp + 1;
  }
  let end = Math.min(text.length, start + maxLen);
  if(end < text.length){
    const sp = text.lastIndexOf(' ', end);
    if(sp > start + maxLen * 0.6) end = sp;
  }
  return (start > 0 ? '…' : '') + text.slice(start, end).trim() + (end < text.length ? '…' : '');
}

// ═══ ערכים קשורים בהקשר ═══
// מבוסס *רק* על הפניות "ראה ערך" שהמחבר כתב בעצמו — לא ניחוש ולא ניקוד.
// נבנה כשכבת תצוגה נפרדת מתחת לתוצאות, ובכוונה אינו משפיע על הדירוג:
// החיפוש הלקסיקלי מדויק במיוחד בכוונות של איתור, ואין סיבה לסכן אותו.
let _inboundLinks = null;
function inboundLinks(){
  if(_inboundLinks) return _inboundLinks;
  _inboundLinks = new Map();
  if(!searchData) return _inboundLinks;
  for(const e of searchData.entries){
    for(const t of (e.r || [])){
      let a = _inboundLinks.get(t);
      if(!a) _inboundLinks.set(t, a = []);
      a.push(e.i);
    }
  }
  return _inboundLinks;
}

// 10 תוצאות הזינו הקשר רק ב-9 מתוך 12 שאילתות בדיקה — בשאילתות רחבות
// ("אור", "נשמה", "תורה") עשר הראשונות היו ערכים מבודדים. 25 נותן כיסוי מלא.
const CTX_FROM_TOP = 25;   // כמה תוצאות מזינות את ההקשר
const CTX_MAX      = 8;    // כמה ערכים הקשריים להציג

function contextualEntries(results){
  if(!searchData || !searchById || !results.length) return [];
  const seed = results.slice(0, CTX_FROM_TOP);
  const already = new Set(results.map(r => r.id));   // לא לחזור על מה שכבר בתוצאות
  const inb = inboundLinks();
  const score = new Map();   // id -> { w: משקל מצטבר, n: כמה תוצאות שונות מקשרות }
  // קישור מהתוצאה הראשונה שווה יותר מקישור מהתוצאה ה-25
  const bump = (id, rank) => {
    if(already.has(id)) return;
    let rec = score.get(id);
    if(!rec) score.set(id, rec = { w: 0, n: 0 });
    rec.w += 1 / (1 + rank / 8);
    rec.n += 1;
  };
  seed.forEach((r, rank) => {
    const rec = searchById[r.id];
    if(!rec) return;
    for(const t of (rec.entry.r || [])) bump(t, rank);       // הערך מפנה אליו
    for(const src of (inb.get(r.id) || [])) bump(src, rank);  // הוא מפנה לערך
  });
  // סף איכות: קישור בודד מתוצאה נמוכה (משקל 0.25) הוא רעש.
  // 0.5 = או קישור מתוך שמונה התוצאות הראשונות, או שני קישורים ומעלה.
  return Array.from(score.entries())
    .filter(pair => pair[1].w >= 0.5 || pair[1].n >= 2)
    .sort((a, b) => b[1].w - a[1].w)
    .slice(0, CTX_MAX)
    .map(pair => {
      const rec = searchById[pair[0]];
      return rec ? { id: pair[0], term: rec.entry.t, n: pair[1].n } : null;
    })
    .filter(Boolean);
}

function renderContextual(results){
  const ctx = contextualEntries(results);
  if(!ctx.length) return '';
  return '<div class="ctx-block">' +
    '<div class="ctx-head">' +
      '<span class="ctx-title">ערכים קשורים בהקשר</span>' +
      '<span class="ctx-sub">לפי הפניות "ראה ערך" שבתוך הערכים שנמצאו</span>' +
    '</div><div class="ctx-list">' +
    ctx.map(c =>
      '<button type="button" class="ctx-item" onclick="goToEntryByEntryId(\'' + escapeAttr(c.id) + '\')" ' +
      'onmouseenter="prefetchEntry(\'' + escapeAttr(c.id) + '\')">' +
      '<span class="ctx-term">' + escapeHtml(c.term) + '</span>' +
      (c.n > 1 ? '<span class="ctx-count" title="מספר הערכים בתוצאות שמקושרים אליו">' + c.n + '</span>' : '') +
      '</button>').join('') +
    '</div></div>';
}

function renderSearchResults(titleOnly){
  const total = currentSearchResults.length;
  const totalPages = Math.max(1, Math.ceil(total / SEARCH_PAGE_SIZE));
  if(currentSearchPage > totalPages) currentSearchPage = totalPages;
  if(currentSearchPage < 1) currentSearchPage = 1;
  setBreadcrumb(['חיפוש', '"' + currentSearchQuery + '"']);

  if(total === 0){
    if(titleOnly && !searchIndexFailed){
      fadeContent('<div class="search-no-results">' +
        '<div class="spinner" style="margin:0 auto 12px;width:28px;height:28px"></div>' +
        'מחפש בתוכן ההגדרות…</div>');
    }else if(currentSearchNote === 'toofar'){
      const ws = currentSearchQuery.trim().split(/\s+/).filter(Boolean);
      fadeContent('<div class="search-no-results">' +
        'כל המילים קיימות במילון, אבל הן לא מופיעות יחד — ' +
        'החיפוש דורש מרחק של עד ' + MAX_WORD_GAP + ' מילים ביניהן.' +
        '<div class="search-hint-words">נסה פחות מילים:' +
        ws.map(w => '<button type="button" class="search-hint-word" onclick="searchFor(\'' +
                    escapeAttr(w) + '\')">' + escapeHtml(w) + '</button>').join('') +
        '</div></div>');
    }else{
      fadeContent('<div class="search-no-results">לא נמצאו תוצאות עבור "<strong>' +
        escapeHtml(currentSearchQuery) + '</strong>"</div>');
    }
    return;
  }

  announce(total + ' תוצאות חיפוש');
  const start = (currentSearchPage - 1) * SEARCH_PAGE_SIZE;
  if(!titleOnly) fillDefIndexes(start, SEARCH_PAGE_SIZE);
  const slice = currentSearchResults.slice(start, start + SEARCH_PAGE_SIZE);
  const mt = currentMatchTokens;

  const items = slice.map(r => {
    let previewHtml = '', defLabel = '';
    if(!titleOnly && searchData && r.ei !== undefined){
      const entry = searchData.entries[r.ei];
      if(entry && entry.d && entry.d.length){
        const di = (r.defIdx !== undefined && r.defIdx >= 0 && r.defIdx < entry.d.length) ? r.defIdx : 0;
        previewHtml = highlightTokens(makeSnippet(entry.d[di], mt, 300), mt);
        if(entry.d.length > 1){
          defLabel = '<span class="search-result-deflabel">הגדרה ' + (di + 1) + '/' + entry.d.length + '</span>';
        }
      }
    }
    return '<div class="search-result" role="button" tabindex="0" data-entry="' + escapeHtml(r.id) + '" ' +
      'onclick="goToEntryByEntryId(\'' + escapeHtml(r.id) + '\')" ' +
      'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();goToEntryByEntryId(\'' + escapeHtml(r.id) + '\');}" ' +
      'onmouseenter="prefetchEntry(\'' + escapeHtml(r.id) + '\')">' +
      '<div class="search-result-head">' +
        '<div class="search-result-term">' + highlightTokens(r.term, mt) + '</div>' +
        '<div class="search-result-topic">' + escapeHtml(r.topicTitle || '') + '</div>' +
      '</div>' +
      (previewHtml ? '<div class="search-result-preview">' + defLabel + previewHtml + '</div>' : '') +
    '</div>';
  }).join('');

  const pagination = totalPages > 1 ?
    '<div class="search-pagination">' +
      '<button class="search-pg-btn" onclick="searchPagePrev()" ' + (currentSearchPage === 1 ? 'disabled' : '') + ' title="עמוד קודם" aria-label="עמוד קודם">›</button>' +
      '<span class="search-pg-info">עמוד ' + currentSearchPage + ' מתוך ' + totalPages + '</span>' +
      '<button class="search-pg-btn" onclick="searchPageNext()" ' + (currentSearchPage === totalPages ? 'disabled' : '') + ' title="עמוד הבא" aria-label="עמוד הבא">‹</button>' +
    '</div>' : '';

  fadeContent(
    '<div class="search-results">' +
      '<div class="search-results-meta" role="status">' + total + ' תוצאות עבור "<strong>' +
        escapeHtml(currentSearchQuery) + '</strong>"' +
        (titleOnly ? ' <span style="color:var(--gold);font-size:0.85em">(מחפש גם בתוכן…)</span>' : '') +
      '</div>' + items + pagination +
      (titleOnly ? '' : renderContextual(currentSearchResults)) +
    '</div>');
}

let _searchPageTitleOnly = false;
function searchPagePrev(){ if(currentSearchPage > 1){ currentSearchPage--; renderSearchResults(_searchPageTitleOnly); } }
function searchPageNext(){
  const tp = Math.ceil(currentSearchResults.length / SEARCH_PAGE_SIZE);
  if(currentSearchPage < tp){ currentSearchPage++; renderSearchResults(_searchPageTitleOnly); }
}

// ─── הרצת חיפוש ───
function runSearch(query){
  const isNew = currentSearchQuery !== query;
  currentSearchQuery = query;
  currentSearchPage  = 1;
  if(isNew) pushNav({ k: 'search', q: query });

  if(!searchIx){
    // האינדקס המלא עדיין לא מוכן — חיפוש כותרות מיידי
    if(!searchIndexFailed) ensureSearchIndex().catch(() => {});
    const titleRes = searchTitlesOnly(query);
    const tr = runEngine(titleIx, query, false);
    currentMatchTokens = collectMatchTokens(titleIx, tr.resolved);
    currentSearchResults = titleRes;
    _searchPageTitleOnly = true;
    renderSearchResults(true);
    return;
  }

  const r = runEngine(searchIx, query, searchOptAlsoContent);
  currentSearchNote = r.note || null;
  currentMatchTokens = collectMatchTokens(searchIx, r.resolved);
  currentResolved    = r.resolved;
  // ההגדרה המתאימה מחושבת עצלנית — רק ל-20 התוצאות שמוצגות בפועל,
  // לא ל-500 התוצאות כולן
  currentSearchResults = r.results.map(x => {
    const entry = searchData.entries[x.ei];
    return { id: entry.i, term: entry.t, topicTitle: searchData.topics[entry.p] || '',
             ei: x.ei, tier: x.tier, defIdx: -1 };
  });
  _searchPageTitleOnly = false;
  renderSearchResults(false);
}

function fillDefIndexes(from, count){
  const resolved = currentResolved;
  if(!searchIx || !resolved) return;
  const end = Math.min(currentSearchResults.length, from + count);
  for(let i = from; i < end; i++){
    const r = currentSearchResults[i];
    if(r.defIdx >= 0) continue;
    const b = bestDefinitionFor(searchIx, r.ei, resolved);
    r.defIdx = b.defIdx >= 0 ? b.defIdx : 0;
  }
}

// לחיצה על מילה מוצעת במסך "לא נמצאו תוצאות"
window.searchFor = function(w){
  const inp = document.getElementById('search');
  if(inp) inp.value = w;
  runSearch(w);
};
function doSearch(){
  const q = document.getElementById('search').value.trim();
  if(q){ clearTimeout(searchDebounceTimer); runSearch(q); }
}
document.getElementById('search').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); doSearch(); }
});

let searchDebounceTimer = null;
const searchInputEl = document.getElementById('search');
// האצה: ברגע שהמשתמש לוחץ/ממקד את שדה החיפוש — מתחילים לטעון את האינדקס
searchInputEl.addEventListener('focus', () => ensureSearchIndex(), { once: true });
searchInputEl.addEventListener('input', e => {
  const q = e.target.value.trim();
  // סינון הסרגל (פידבק מיידי)
  document.querySelectorAll('.entry-link').forEach(el => {
    el.style.display = !q || el.textContent.includes(q) ? 'flex' : 'none';
  });
  if(q) document.querySelectorAll('.topic').forEach(el => el.classList.add('open'));

  // חיפוש המסך הראשי (debounced)
  clearTimeout(searchDebounceTimer);
  if(!q){
    // ריק → חזור למסך הקודם
    currentSearchQuery = "";
    if(currentEntry){
      goToEntryByEntryId(currentEntry);
    }else if(currentTopic && data && data.topics){
      const t = data.topics.find(x => x.id === currentTopic);
      if(t) renderTopicLanding(t, data.topics.indexOf(t));
    }
    return;
  }
  searchDebounceTimer = setTimeout(() => runSearch(q), 250);
});

// ─── Bookmarks (per-entry) ───
const BOOKMARKS_KEY = 'milon_bookmarks_v1';
// מוחזק בזיכרון — renderNav קרא ל-isBookmarked 653 פעם, כלומר 653 JSON.parse בכל רינדור
let _bookmarks = null;
function getBookmarks(){
  if(_bookmarks) return _bookmarks;
  try{ _bookmarks = new Set(JSON.parse(lsGet(BOOKMARKS_KEY) || '[]')); }
  catch(e){ _bookmarks = new Set(); }
  return _bookmarks;
}
function saveBookmarks(s){
  _bookmarks = s;
  // localStorage זורק במצב פרטי / כשהמכסה מלאה — אסור שיפיל את הלחיצה
  lsSet(BOOKMARKS_KEY, JSON.stringify([...s]));
}
function isBookmarked(eid){ return getBookmarks().has(eid); }
// טאב אחר שינה סימניות — רענן את המצב בזיכרון ואת הסימונים בסרגל
window.addEventListener('storage', e => {
  if(e.key !== BOOKMARKS_KEY) return;
  _bookmarks = null;
  const s = getBookmarks();
  document.querySelectorAll('.entry-link[data-entry]').forEach(el => {
    el.classList.toggle('bookmarked', s.has(el.dataset.entry));
  });
  const btn = document.querySelector('.entry-bookmark');
  if(btn && currentEntry) btn.classList.toggle('active', s.has(currentEntry));
  if(currentPage === 'bookmarks') setPage('bookmarks');
});
function toggleBookmark(eid){
  const s = getBookmarks();
  if(s.has(eid)) s.delete(eid); else s.add(eid);
  saveBookmarks(s);
  return s.has(eid);
}
function updateBookmarkCount(){
  const n = getBookmarks().size;
  const badge = document.getElementById('bookmarks-badge');
  if(badge){
    badge.textContent = n;
    badge.style.display = n > 0 ? 'inline-flex' : 'none';
  }
}
document.getElementById('bookmarks-page-btn').addEventListener('click', () => setPage('bookmarks'));
document.getElementById('newtab-btn').addEventListener('click', () => window.newTab());

window.onToggleBookmark = function(eid, btn){
  const now = toggleBookmark(eid);
  if(btn){
    btn.classList.toggle('active', now);
    btn.setAttribute('aria-pressed', now ? 'true' : 'false');
    btn.setAttribute('aria-label', now ? 'הסר מהסימניות' : 'הוסף לסימניות');
    btn.setAttribute('title', now ? 'הסר מהסימניות' : 'הוסף לסימניות');

};

function resetSearchState(){
  const inp = document.getElementById('search');
  if(inp) inp.value = '';
  clearTimeout(searchDebounceTimer);
  currentSearchQuery   = '';
  currentSearchResults = [];
  currentSearchPage    = 1;
  // החזר את הסרגל למצב מלא (אם הוא סונן)
  document.querySelectorAll('.entry-link').forEach(el => { el.style.display = ''; });

  const pop = document.getElementById('search-popover');
  const btn = document.getElementById('search-settings-btn');
  if(pop) pop.classList.remove('open');
  if(btn) btn.classList.remove('active');
}

// Page switching (about/contact)
let currentPage = 'dictionary';
function setPage(p){
  if(p !== currentPage) pushNav({ k: 'page', p: p });
  currentPage = p;
  resetSearchState();   // ← תמיד מאפס חיפוש במעבר עמוד
  document.querySelectorAll('.page-btn').forEach(b => b.classList.toggle('active', b.dataset.page === p));
  if(p === 'about'){
    setBreadcrumb(['אוצר המונחים', 'אודות']);
    fadeContent(renderAbout());
  }else if(p === 'contact'){
    setBreadcrumb(['אוצר המונחים', 'צור קשר']);
    fadeContent(renderContact());
  }else if(p === 'bookmarks'){
    setBreadcrumb(['אוצר המונחים', 'סימניות']);
    fadeContent(renderBookmarks());
  }else{
    // ─── חזרה לעמוד הראשי של המילון: איפוס מלא + הצגת המדור הראשון ───
    currentEntry = null;
    if(data && data.topics && data.topics.length){
      const t = data.topics[0];
      currentTopic = t.id;
      // סגור את כל המדורים, פתח רק את הראשון
      document.querySelectorAll('.topic').forEach(el => {
        el.classList.toggle('open', el.dataset.topic === t.id);
        const head = el.querySelector('.topic-head');
        if(head) head.classList.toggle('active', el.dataset.topic === t.id);
      });
      // הסר סימון של ערך פעיל
      document.querySelectorAll('.entry-link').forEach(el => el.classList.remove('active'));
      renderTopicLanding(t, 0);
    }
  }
}

      <h1 class="info-title">הערכים השמורים שלי</h1>

      <div class="info-rule"></div>
      ${Object.values(byTopic).map(g => `
        <div class="bookmark-group">

              const preview = previewRaw.length > 120 ? previewRaw.slice(0, 120) + '…' : previewRaw;

                     onclick="goToEntryByEntryId('${escapeAttr(e.id)}')"

                <span class="bookmark-arrow">←</span>
              </div>
            `;}).join('')}
          </div>
        </div>
      `).join('')}
      <div class="entry-flourish">❦ ✦ ❦</div>
    </div>
  `;
}

// ─── מגירת ניווט למובייל ───
const MOBILE_Q = window.matchMedia('(max-width: 860px)');
function isMobile(){ return MOBILE_Q.matches; }
let _navReturnFocus = null;
function setNavOpen(open){
  const wasOpen = document.body.classList.contains('nav-open');
  document.body.classList.toggle('nav-open', open);
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('nav-backdrop');
  if(sb){
    sb.classList.toggle('open', open);
    // inert (בנוסף ל-visibility) — חוסם גם עכבר וגם מקלדת בדפדפנים תומכים
    if(isMobile() && !open) sb.setAttribute('inert', '');
    else sb.removeAttribute('inert');
  }
  if(bd) bd.classList.toggle('open', open);
  const btn = document.getElementById('nav-toggle');
  if(btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  if(!isMobile()) return;
  if(open && !wasOpen){
    _navReturnFocus = document.activeElement;
    const first = document.getElementById('search');
    if(first) setTimeout(() => first.focus(), 60);
  }else if(!open && wasOpen){
    // החזר את המיקוד למקום שממנו נפתחה המגירה
    const back = _navReturnFocus && _navReturnFocus.focus ? _navReturnFocus : btn;
    if(back && back.focus) back.focus();
    _navReturnFocus = null;
  }
}
// ═══ ניווט היסטוריה: כפתור "אחורה" מחזיר מסך, לא יוצא מהאתר ═══
let _navLock = false;   // מונע דחיפת state בזמן טיפול ב-popstate
function pushNav(st, replace){
  if(_navLock) return;
  try{
    const fn = replace ? 'replaceState' : 'pushState';
    history[fn](st, '');
  }catch(e){}
  touchTab(st);
}
function applyNav(st){
  _navLock = true;
  try{
    if(!st || !st.k){
      setPage('dictionary');
    }else if(st.k === 'entry' && st.t && st.e){
      goToEntry(st.t, st.e);
    }else if(st.k === 'topic' && st.t && data){
      const ti = data.topics.findIndex(t => t.id === st.t);
      if(ti >= 0){ currentTopic = st.t; currentEntry = null; renderTopicLanding(data.topics[ti], ti); }
    }else if(st.k === 'search' && st.q){
      const inp = document.getElementById('search');
      if(inp) inp.value = st.q;
      runSearch(st.q);
    }else if(st.k === 'page'){
      setPage(st.p || 'dictionary');
    }
  }finally{
    _navLock = false;
  }
}
// ═══ לשוניות ═══
// כל לשונית שומרת את אותו תיאור-מצב שההיסטוריה כבר משתמשת בו,
// כך שאין כאן מערכת ניווט שנייה — רק כמה מצבים מקבילים.
const TABS_KEY = 'milon_tabs_v1';
let tabs = [];
let activeTab = 0;
let _tabLock = false;

function tabTitle(st){
  if(!st || !st.k) return 'המילון';
  if(st.k === 'entry'){
    const f = findEntry(st.e);
    return f ? f.entry.term : 'ערך';
  }
  if(st.k === 'topic'){
    const t = data && data.topics.find(x => x.id === st.t);
    return t ? t.title : 'מדור';
  }
  if(st.k === 'search') return 'חיפוש: ' + st.q;
  if(st.k === 'page') return ({about:'אודות', contact:'צור קשר', bookmarks:'סימניות'})[st.p] || 'המילון';
  return 'המילון';
}

function saveTabs(){
  lsSet(TABS_KEY, JSON.stringify({ a: activeTab, t: tabs.map(x => x.st) }));
}

function renderTabs(){
  const bar = document.getElementById('tabbar');
  if(!bar) return;
  // לשונית אחת בלבד — אין מה להציג, הסרגל רק גוזל גובה
  bar.classList.toggle('show', tabs.length > 1);
  bar.innerHTML = tabs.map((t, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" role="tab"' +
    ' aria-selected="' + (i === activeTab ? 'true' : 'false') + '"' +
    ' onclick="switchTab(' + i + ')" title="' + escapeAttr(t.title) + '">' +
    '<span class="tab-label">' + escapeHtml(t.title) + '</span>' +
    '<span class="tab-close" role="button" aria-label="סגור לשונית"' +
    ' onclick="event.stopPropagation(); closeTab(' + i + ')">×</span>' +
    '</button>'
  ).join('') + '<button class="tab-new" type="button" title="לשונית חדשה" aria-label="לשונית חדשה" onclick="newTab()">+</button>';
}

// נקרא מכל מקום שבו ההיסטוריה נדחפת — כך הלשונית תמיד משקפת את המסך
function touchTab(st){
  if(_tabLock) return;
  if(!tabs.length) tabs = [{ st: st, title: tabTitle(st) }], activeTab = 0;
  else { tabs[activeTab].st = st; tabs[activeTab].title = tabTitle(st); }
  renderTabs();
  saveTabs();
}

window.switchTab = function(i){
  if(i === activeTab || !tabs[i]) return;
  activeTab = i;
  _tabLock = true;
  try{ applyNav(tabs[i].st); } finally { _tabLock = false; }
  renderTabs();
  saveTabs();
};

window.closeTab = function(i){
  if(tabs.length <= 1) return;          // תמיד נשארת לשונית אחת
  tabs.splice(i, 1);
  if(activeTab >= tabs.length) activeTab = tabs.length - 1;
  else if(i < activeTab) activeTab--;
  _tabLock = true;
  try{ applyNav(tabs[activeTab].st); } finally { _tabLock = false; }
  renderTabs();
  saveTabs();
};

window.newTab = function(){
  const st = (data && data.topics.length) ? { k: 'topic', t: data.topics[0].id } : { k: 'page', p: 'dictionary' };
  tabs.push({ st: st, title: tabTitle(st) });
  activeTab = tabs.length - 1;
  _tabLock = true;
  try{ applyNav(st); } finally { _tabLock = false; }
  renderTabs();
  saveTabs();
};

// פתיחת ערך בלשונית חדשה — משמש בקישורי "ראה גם" ובתוצאות החיפוש
window.openInNewTab = function(entryId){
  const f = findEntry(entryId);
  if(!f) return;
  const st = { k: 'entry', t: f.topic.id, e: f.entry.id };
  tabs.push({ st: st, title: tabTitle(st) });
  activeTab = tabs.length - 1;
  renderTabs();
  saveTabs();
  goToEntry(f.topic.id, f.entry.id);
};

function restoreTabs(){
  try{
    const raw = lsGet(TABS_KEY);
    if(!raw) return false;
    const o = JSON.parse(raw);
    if(!o || !Array.isArray(o.t) || !o.t.length) return false;
    tabs = o.t.map(st => ({ st: st, title: tabTitle(st) }));
    activeTab = Math.min(Math.max(0, o.a | 0), tabs.length - 1);
    renderTabs();
    _tabLock = true;
    try{ applyNav(tabs[activeTab].st); } finally { _tabLock = false; }
    return true;
  }catch(e){ return false; }
}

window.addEventListener('popstate', e => {
  // במובייל: אם המגירה פתוחה, "אחורה" קודם כל סוגר אותה
  if(document.body.classList.contains('nav-open')){ setNavOpen(false); }
  applyNav(e.state);
});

window.toggleNav = function(){ setNavOpen(!document.body.classList.contains('nav-open')); };
document.getElementById('nav-toggle').addEventListener('click', window.toggleNav);
document.getElementById('nav-backdrop').addEventListener('click', () => setNavOpen(false));
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && document.body.classList.contains('nav-open')) setNavOpen(false);
});
// המגירה הסגורה חייבת להיות inert במובייל, ולא-inert בדסקטופ
function _syncDrawerInert(){
  const sb = document.getElementById('sidebar');
  if(!sb) return;
  if(isMobile() && !document.body.classList.contains('nav-open')) sb.setAttribute('inert', '');
  else sb.removeAttribute('inert');
}
_syncDrawerInert();
// אם המסך הורחב חזרה לדסקטופ — אין טעם להשאיר מצב "מגירה פתוחה"
const onMQChange = e => { if(!e.matches) setNavOpen(false); _syncDrawerInert(); };
if(MOBILE_Q.addEventListener) MOBILE_Q.addEventListener('change', onMQChange);
else if(MOBILE_Q.addListener) MOBILE_Q.addListener(onMQChange);

// ─── Splitter (גרירה לשינוי רוחב הסרגל הצדדי) ───
(function setupSplitter(){
  const SPLIT_KEY = 'milon_sidebar_width_v1';
  const splitter = document.getElementById('splitter');
  if(!splitter) return;

  const MIN = 220;   // רוחב מינימום של הסרגל
  const MAX_PCT = 0.6; // עד 60% מרוחב המסך

  // שחזור רוחב שמור
  const saved = parseInt(lsGet(SPLIT_KEY) || '', 10);
  if(saved && saved >= MIN && saved <= window.innerWidth * MAX_PCT){
    document.documentElement.style.setProperty('--sidebar-width', saved + 'px');
  }

  // ── הפעלה במקלדת: חיצים משנים רוחב, Home מאפס ──
  function currentWidth(){
    const v = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width'), 10);
    return v || 340;
  }
  function setWidth(w){
    const max = window.innerWidth * MAX_PCT;
    w = Math.max(MIN, Math.min(w, max));
    document.documentElement.style.setProperty('--sidebar-width', w + 'px');
    lsSet(SPLIT_KEY, String(w));
    splitter.setAttribute('aria-valuenow', String(Math.round(w)));
  }
  splitter.addEventListener('keydown', e => {
    const step = e.shiftKey ? 40 : 12;
    // RTL: הסרגל בימין, לכן חץ שמאלה מגדיל אותו
    if(e.key === 'ArrowLeft')       { setWidth(currentWidth() + step); }
    else if(e.key === 'ArrowRight') { setWidth(currentWidth() - step); }
    else if(e.key === 'Home')       { document.documentElement.style.removeProperty('--sidebar-width'); lsDel(SPLIT_KEY); }
    else return;
    e.preventDefault();
  });

  let dragging = false;
  function endDrag(){
    if(!dragging) return;
    dragging = false;
    splitter.classList.remove('dragging');
    document.body.classList.remove('resizing');
    const w = getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width');
    const px = parseInt(w, 10);
    if(px) lsSet(SPLIT_KEY, px);
  }
  splitter.addEventListener('pointerdown', (e) => {
    dragging = true;
    splitter.classList.add('dragging');
    document.body.classList.add('resizing');
    try{ splitter.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  // גרירה שנגמרת מחוץ לחלון השאירה את הממשק מוקפא (pointer-events:none על הכל)
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  window.addEventListener('blur', endDrag);

  document.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    // ב-RTL הסרגל בצד ימין; הרוחב = (innerWidth - clientX - padding)
    const padding = 16; // .page padding
    let w = window.innerWidth - e.clientX - padding;
    const max = window.innerWidth * MAX_PCT;
    if(w < MIN) w = MIN;
    if(w > max) w = max;
    document.documentElement.style.setProperty('--sidebar-width', w + 'px');
  });

  // רוחב שמור עלול להיות רחב מדי אחרי הקטנת החלון — מצמצמים מחדש
  window.addEventListener('resize', () => {
    const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width'), 10);
    if(!cur) return;
    const max = window.innerWidth * MAX_PCT;
    if(cur > max) document.documentElement.style.setProperty('--sidebar-width', Math.max(MIN, max) + 'px');
  });

  // double-click איפוס לברירת מחדל
  splitter.addEventListener('dblclick', () => {
    document.documentElement.style.removeProperty('--sidebar-width');
    lsDel(SPLIT_KEY);
  });
})();

setPage('dictionary');
load();

// ── רישום Service Worker (שמירת קבצים למחשב המשתמש) ──
// ── ריצה בתוך אפליקציה (Capacitor) לעומת דפדפן ──
// אותו קובץ מזין את שניהם; ההבדלים מטופלים בזמן ריצה ולא בעותק נפרד.
const IS_APP = typeof window.Capacitor !== 'undefined';

if(IS_APP){
  // באפליקציה כל התוכן ארוז ב-APK — Service Worker רק היה מוסיף שכבת קאש מיותרת
  document.body.classList.add('in-app');
  // כפתור "אחורה" של אנדרואיד: חוזר מסך, ורק בסוף יוצא מהאפליקציה
  const CapApp = window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if(CapApp && CapApp.addListener){
    CapApp.addListener('backButton', () => {
      if(document.body.classList.contains('nav-open')){ setNavOpen(false); return; }
      if(history.length > 1){ history.back(); return; }
      CapApp.exitApp();
    });
  }
}else if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW registration failed:', err));
}
</script>
