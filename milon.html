<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>מילון פנימיות התורה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700;900&family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-dark: #4a2f17;
    --wood: #6b4520;
    --wood-warm: #8b6428;
    --wood-light: #c9a060;
    --cream: #f8f0dc;
    --cream-2: #efe4c8;
    --cream-3: #e2d3b0;
    --gold: #b8893a;
    --gold-bright: #e2b558;
    --gold-deep: #8a6018;
    --ink: #2a1a08;
    --ink-soft: #5a3e1e;
    --ink-faint: #8a6e48;
    --crimson: #8b2e1c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{height:100%; overflow:hidden;}
  body{
    font-family: 'Frank Ruhl Libre', 'David Libre', serif;
    color: var(--ink);
    background:
      linear-gradient(135deg, #2a1808 0%, #4a2f17 100%);
    direction: rtl;
    font-size: 16px;
    line-height: 1.7;
  }

  .page{
    display: grid;
    grid-template-columns: var(--sidebar-width, 340px) 6px 1fr;
    height: 100vh;
    padding: 16px;
    gap: 0;
  }

  /* ─── Splitter (גרירה לשינוי פרופורציה בין סרגל וחלון) ─── */
  .splitter{
    cursor: col-resize;
    position: relative;
    background: transparent;
    transition: background 0.15s;
    z-index: 10;
  }
  .splitter::before{
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 4px;
    height: 60px;
    background: var(--gold);
    border-radius: 2px;
    opacity: 0.55;
    transition: opacity 0.15s, background 0.15s;
  }
  .splitter:hover::before{ opacity: 1; background: var(--gold-bright); }
  .splitter.dragging::before{ opacity: 1; background: var(--crimson); }
  body.resizing{ cursor: col-resize; user-select: none; }
  body.resizing iframe, body.resizing *{ pointer-events: none; }
  body.resizing .splitter{ pointer-events: auto; }

  /* ─── Sidebar ─── */
  .sidebar{
    position: relative;
    background:
      linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    border-radius: 8px 0 0 8px;
    box-shadow:
      0 12px 40px rgba(0,0,0,0.5),
      inset 0 0 0 1px rgba(184, 137, 58, 0.3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar::before{
    content: "";
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(180deg,
        transparent 0px, transparent 2px,
        rgba(120,80,30,0.03) 2px, rgba(120,80,30,0.03) 3px);
    pointer-events: none;
  }
  .sidebar::after{
    content: none;
  }

  .brand{
    padding: 13px 12px 9px;
    text-align: center;
    border-bottom: 1px double var(--gold-deep);
    position: relative;
  }
  .brand-emblem{
    width: 48px; height: auto;
    margin: 0 auto 5px;
    display: block;
    filter: drop-shadow(0 2px 3px rgba(90,30,16,0.2));
  }
  .brand-title{
    font-weight: 900;
    color: var(--ink);
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .brand-subtitle{
    color: var(--gold-deep);
    font-size: 9px;
    letter-spacing: 0.25em;
  }
  .brand-tagline{
    margin-top: 8px;
    font-size: 10px;
    color: var(--crimson);
    letter-spacing: 0.4em;
    font-weight: 700;
    font-style: italic;
    opacity: 0.75;
  }
    margin-top: 6px;
    letter-spacing: 0.2em;
    font-weight: 600;
  }

  /* ─── תיבת חיפוש מאוחדת ─── */
  .search-wrap{
    margin: 16px 18px 8px;
    position: relative;
    z-index: 10;
  }
  .search{
    display: flex;
    flex-direction: row;
    align-items: stretch;
    background: rgba(255,255,255,0.65);
    border: 1.5px solid var(--gold-deep);
    border-radius: 5px;
    overflow: hidden;
    transition: box-shadow 0.15s;
  }
  .search:focus-within{
    box-shadow: 0 0 0 2px var(--gold-bright);
    background: rgba(255,255,255,0.85);
  }
  .search-icon{
    flex-shrink: 0;
    padding: 0 9px;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    pointer-events: none;
  }
  .search input{
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    color: var(--ink);
    padding: 9px 2px 9px 0;
    font-family: inherit;
    font-size: 14px;
    direction: rtl;
    outline: none;
  }
  .search input::placeholder{ color: var(--ink-faint); }
  .search-go-btn{
    flex-shrink: 0;
    background: var(--gold-deep);
    border: none;
    border-right: 1.5px solid var(--gold-deep);
    color: var(--cream);
    cursor: pointer;
    padding: 0 13px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
    display: flex;
    align-items: center;
    transition: background 0.15s;
  }
  .search-go-btn:hover{ background: var(--wood-dark); }
  .search-settings-btn{
    flex-shrink: 0;
    background: transparent;
    border: none;
    border-right: 1px solid rgba(184,137,58,0.35);
    color: var(--ink-faint);
    cursor: pointer;
    padding: 0 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, background 0.15s;
  }
  .search-settings-btn:hover{ color: var(--gold-deep); background: rgba(184,137,58,0.08); }
  .search-settings-btn.active{ color: var(--gold-deep); background: rgba(184,137,58,0.12); }
  .search-popover{
    display: none;
    position: fixed;
    background: var(--cream);
    border: 1px solid var(--gold-deep);
    border-radius: 6px;
    padding: 10px 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    z-index: 9999;
    font-size: 13px;
    min-width: 180px;
  }
  .search-popover.open{ display: block; }
  .search-option{
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    color: var(--ink);
    padding: 4px 0;
  }
  .search-option input[type="radio"]{ accent-color: var(--gold-deep); }
  .search-option-hint{
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dotted var(--gold);
    font-size: 11px;
    color: var(--ink-faint);
    font-style: italic;
  }

  /* ─── עמוד תוצאות חיפוש ─── */
  .search-results{ padding: 8px 0 32px; }
  .search-results-meta{
    font-size: 14px;
    color: var(--ink-faint);
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px dotted var(--gold);
    letter-spacing: 0.04em;
  }
  .search-result{
    padding: 16px 8px;
    border-bottom: 1px dotted var(--gold);
    cursor: pointer;
    transition: background 0.15s;
  }
  .search-result:hover{ background: rgba(184,137,58,0.06); }
  .search-result-head{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }
  .search-result-term{
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.3;
  }
  .search-result-topic{
    font-size: 11px;
    color: var(--gold-deep);
    background: var(--cream-2);
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  .search-result-preview{
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.65;
    text-align: justify;
  }
  .search-hl{
    background: linear-gradient(180deg, transparent 50%, #f0dfa0 50%);
    padding: 0 1px;
    border-radius: 1px;
    font-weight: 600;
    color: var(--ink);
  }
  /* מרקר בדף הערך עצמו — בז' עם אנימציית הבהוב */
  mark.search-hl-mark{
    background: #fde68a;
    color: var(--ink);
    border-radius: 3px;
    padding: 1px 2px;
    font-weight: 700;
    box-shadow: 0 0 0 2px #f59e0b44;
    animation: hl-pulse 1.4s ease-out 3;
  }
  @keyframes hl-pulse{
    0%,100%{ background:#fde68a; box-shadow:0 0 0 2px #f59e0b44; }
    50%{ background:#fbbf24; box-shadow:0 0 0 5px #f59e0b55; }
  }
  .search-no-results{
    text-align: center;
    padding: 80px 0;
    color: var(--ink-faint);
    font-size: 16px;
  }
  .search-pagination{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px dotted var(--gold);
  }
  .search-pg-btn{
    background: var(--cream-2);
    border: 1px solid var(--gold-deep);
    color: var(--ink);
    width: 32px; height: 32px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .search-pg-btn:hover:not(:disabled){ background: var(--cream-3); }
  .search-pg-btn:disabled{ opacity: 0.35; cursor: default; }
  .search-pg-info{
    color: var(--ink-faint);
    font-size: 13px;
    letter-spacing: 0.04em;
  }

  .nav{
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px 20px;
  }
  .nav::-webkit-scrollbar{ width: 6px; }
  .nav::-webkit-scrollbar-thumb{ background: var(--gold-deep); border-radius: 3px; }

  .topic{ margin-bottom: 8px; position: relative; }
  .topic-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    cursor: pointer;
    background: rgba(255,255,255,0.4);
    border: 1px solid var(--gold-deep);
    transition: all 0.15s;
    user-select: none;
    position: relative;
  }
  .topic-head::before{
    content: "";
    position: absolute;
    right: -8px; top: 50%;
    transform: translateY(-50%) rotate(45deg);
    width: 14px; height: 14px;
    background: var(--cream);
    border: 1px solid var(--gold-deep);
    border-left: none;
    border-bottom: none;
    z-index: 0;
  }
  .topic-head:hover{ background: rgba(212,176,106, 0.3); }
  .topic-head.active{
    background: var(--ink);
    color: var(--cream);
    border-color: var(--ink);
  }
  .topic-head.active::before{
    background: var(--ink);
    border-color: var(--ink);
  }
  .topic-head.active .topic-subtitle{ color: var(--gold-bright); }
  .topic-title{
    font-weight: 700;
    font-size: 18px;
    position: relative;
    z-index: 1;
  }
  .topic-subtitle{
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 3px;
    letter-spacing: 0.04em;
    position: relative;
    z-index: 1;
  }
  .topic-count{
    background: var(--gold);
    color: var(--cream);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    min-width: 22px;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .topic-head.active .topic-count{ background: var(--gold-bright); color: var(--ink); }

  .entries{
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.3s ease;
    padding: 0 8px;
  }
  /* גובה מספיק גדול שיכיל גם מדורים עם מאות ערכים — הגלילה נשארת ב-.nav */
  .topic.open .entries{ max-height: 50000px; padding-top: 6px; padding-bottom: 6px;}

  .entry-link{
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 6px 12px;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 15px;
    border-right: 2px solid transparent;
    transition: all 0.15s;
    user-select: none;
    position: relative;
  }
  .entry-link::before{
    content: attr(data-num);
    color: var(--gold);
    font-size: 11px;
    font-weight: 700;
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }
  .entry-link:hover{ color: var(--ink); background: rgba(255,255,255,0.4); }
  .entry-link.active{
    color: var(--crimson);
    border-right-color: var(--crimson);
    background: rgba(139,46,28, 0.08);
    font-weight: 700;
  }
  .entry-link.bookmarked::after{
    content: "";
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 7px;
    height: 9px;
    background: var(--crimson);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%);
    opacity: 0.85;
  }

  /* ─── Main ─── */
  .main{
    position: relative;
    background:
      linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    border-radius: 0 8px 8px 0;
    box-shadow:
      0 12px 40px rgba(0,0,0,0.5),
      inset 0 0 0 1px rgba(184, 137, 58, 0.3);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .main::before{
    content: "";
    position: absolute;
    top: 0; bottom: 0; right: 0;
    width: 12px;
    background: linear-gradient(270deg, transparent, rgba(0,0,0,0.15));
    pointer-events: none;
    z-index: 5;
  }
  .main::after{
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(184,137,58,0.04) 0%, transparent 30%),
      radial-gradient(circle at 80% 70%, rgba(184,137,58,0.04) 0%, transparent 30%);
    pointer-events: none;
  }

  .topbar{
    height: 56px;
    flex-shrink: 0;
    border-bottom: 2px double var(--gold-deep);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 36px;
    position: relative;
    z-index: 2;
  }
  .breadcrumb{
    color: var(--ink-soft);
    font-size: 14px;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .breadcrumb-current{ color: var(--ink); font-weight: 700; }
  .breadcrumb-sep{ color: var(--gold-deep); }

  .sidebar-pages{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    padding: 0 12px 12px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--gold);
  }
  .page-btn{
    background: transparent;
    border: none;
    border-left: 1px solid var(--gold);
    color: var(--ink-soft);
    padding: 10px 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }
  .page-btn:last-child{ border-left: none; }
  .page-btn svg{ color: var(--gold-deep); transition: color 0.15s; }
  .page-btn:hover{
    color: var(--ink);
    background: rgba(184,137,58, 0.08);
  }
  .page-btn:hover svg{ color: var(--crimson); }
  .page-btn.active{
    color: var(--crimson);
  }
  .page-btn.active svg{ color: var(--crimson); }

  .toolbar{
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .tool-btn{
    background: rgba(255,255,255,0.5);
    border: 1px solid var(--gold);
    color: var(--gold-deep);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s ease;
    font-family: inherit;
    position: relative;
  }
  .tool-btn:hover{
    background: var(--cream);
    color: var(--ink);
    border-color: var(--gold-deep);
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(138,96,24, 0.2);
  }
  .tool-btn.active{
    background: linear-gradient(180deg, var(--crimson), #6e1f11);
    color: var(--gold-bright);
    border-color: #6e1f11;
    box-shadow: 0 2px 6px rgba(139,46,28, 0.35), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .tool-btn svg{ display: block; }
  .tool-divider{
    width: 1px;
    height: 22px;
    background: var(--gold);
    opacity: 0.5;
    margin: 0 2px;
  }

  .scroll-area{
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0;
    position: relative;
    z-index: 1;
  }
  .scroll-area::-webkit-scrollbar{ width: 8px; }
  .scroll-area::-webkit-scrollbar-thumb{ background: var(--gold-deep); border-radius: 4px; }

  .content{
    max-width: 800px;
    margin: 0 auto;
    padding: 50px 60px 80px;
    position: relative;
    min-height: 100%;
  }

  /* ─── Spinner (טעינת ערך) ─── */
  .spinner-wrap{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px 0;
    gap: 20px;
  }
  .spinner{
    width: 40px; height: 40px;
    border: 3px solid var(--cream-3);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .spinner-text{
    font-size: 0.95em;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
  }

  /* fade animation for content swap */
  .fade-stage{
    animation: fadeIn 250ms ease both;
  }
  @keyframes fadeIn{
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Topic landing (when no entry chosen yet) */
  .topic-landing{
    text-align: center;
    padding-top: 40px;
  }
  .topic-landing-eyebrow{
    color: var(--gold-deep);
    font-size: 11px;
    letter-spacing: 0.4em;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .topic-landing-title{
    font-size: 64px;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: 0.01em;
    margin-bottom: 8px;
    line-height: 1;
  }
  .topic-landing-subtitle{
    font-size: 17px;
    color: var(--ink-soft);
    font-style: italic;
    margin-top: 8px;
  }
  .topic-landing-rule{
    width: 60%;
    margin: 28px auto 36px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent);
    position: relative;
  }
  .topic-landing-rule::after{
    content: "✦";
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    background: var(--cream);
    color: var(--gold);
    padding: 0 16px;
    font-size: 16px;
  }
  .topic-landing-hint{
    color: var(--ink-faint);
    font-size: 15px;
    font-style: italic;
    letter-spacing: 0.04em;
  }
  .entry-grid{
    margin-top: 36px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
    text-align: right;
  }
  .entry-card{
    padding: 10px 14px 12px;
    background: rgba(255,255,255,0.5);
    border: 1px solid var(--gold);
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    min-width: 0;
  }
  .entry-card:hover{
    background: var(--ink);
    color: var(--cream);
    border-color: var(--ink);
  }
  .entry-card-num{
    color: var(--gold-deep);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.18em;
    margin-bottom: 3px;
  }
  .entry-card:hover .entry-card-num{ color: var(--gold-bright); }
  .entry-card-term{
    font-size: 17px;
    font-weight: 900;
    color: inherit;
    line-height: 1.2;
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  /* Entry layout — single entry per page */
  .entry-page{
    position: relative;
  }
  .entry-page-header{
    margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--gold);
    position: relative;
  }
  .entry-page-header::after{
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -3px;
    height: 1px;
    background: var(--gold);
  }
  .entry-eyebrow{
    color: var(--gold-deep);
    font-size: 11px;
    letter-spacing: 0.4em;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .entry-eyebrow::after{
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--gold), transparent);
    opacity: 0.5;
  }
  .entry-term{
    font-size: 56px;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: 0.01em;
    line-height: 1.05;
    margin-bottom: 6px;
    display: flex;
    align-items: center;

<script>
const TERMS_URL   = "terms.json";
const SEARCH_URL  = "search-index.json?v=2026-05-09-2234"; // AUTO_VERSION
const ENTRY_URL_PREFIX = "entries/";
// data = מבנה הסרגל בלבד (id+term per entry). תוכן מלא נטען לפי דרישה.
let data            = null;
let searchIndex     = null;             // ייטען במקביל
let searchIndexById = null;             // map: id → searchIndex item (לתצוגות מהירות)
const entryCache    = new Map();        // id → entry data (lazy-loaded)
let currentTopic    = null;
let currentEntry    = null;

// ─── Lazy load של ערך בודד (עם cache) ───
async function loadEntry(id){
  if(entryCache.has(id)) return entryCache.get(id);
  // משתמש באותה גרסה כמו SEARCH_URL כדי לפסול cache ישן באוטומציה
  const v = SEARCH_URL.split('?v=')[1] || '';
  const url = `${ENTRY_URL_PREFIX}${id}.json${v ? '?v='+v : ''}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`טעינת ערך ${id} נכשלה (${res.status})`);
  const entry = await res.json();
  entryCache.set(id, entry);
  return entry;
}

async function load(){
  // ── רק שני קבצים בטעינה הראשונית: terms (סרגל) + search-index (חיפוש) ──
  const termsP = fetch(TERMS_URL).then(r => r.json());
  const idxP   = fetch(SEARCH_URL).then(r => r.json());

  // terms.json (~12KB compressed) — ראשון → סרגל מיד
  const terms = await termsP;
  data = terms;
  renderNav();
  if(data.topics.length){
    currentTopic = data.topics[0].id;
    document.querySelector('.topic').classList.add('open');
    document.querySelector('.topic-head').classList.add('active');
    renderTopicLanding(data.topics[0], 0);
  }

  // search-index.json — מנוע החיפוש + previews לסימניות
  idxP.then(idx => {
    // post-process: בונה textN מ-defsN
    for(const item of idx){
      if(item.defsN && Array.isArray(item.defsN)){
        item.textN = item.defsN.join(' ');
      }else if(!item.textN){
        item.textN = '';
      }
    }
    searchIndex = idx;
    // map עזר לחיפוש מהיר לפי id (לסימניות, related)
    searchIndexById = {};
    for(const item of idx){
      searchIndexById[item.id] = item;
    }
    // אם המשתמש כבר הקליד משהו לפני שהאינדקס הגיע — הרץ חיפוש עכשיו
    const q = document.getElementById('search').value.trim();
    if(q) runSearch(q);
  }).catch(err => console.error('search-index.json load failed:', err));
}

// קדם-טען את הערכים הסמוכים (לפני/אחרי) ואת הקשורים
function prefetchNeighbors(topicId, ei){
  const topic = data.topics.find(t => t.id === topicId);
  if(!topic) return;
  // הקודם והבא ברשימה
  if(ei > 0) prefetchEntry(topic.entries[ei-1].id);
  if(ei < topic.entries.length-1) prefetchEntry(topic.entries[ei+1].id);
  // קשורים — נטענים בעצלתיים מהערך עצמו אם ה-DOM כבר נבנה
  requestIdleCallback ? requestIdleCallback(prefetchRelatedFromDom, {timeout: 2000})
                      : setTimeout(prefetchRelatedFromDom, 500);
}
function prefetchRelatedFromDom(){
  document.querySelectorAll('.related-link[data-entry]').forEach(el => {
    prefetchEntry(el.dataset.entry);
  });
}

async function goToEntry(topicId, entryId){
  // עדכן סרגל
  if(currentTopic !== topicId){
    document.querySelectorAll('.topic').forEach(el => {
      el.classList.toggle('open', el.dataset.topic === topicId);
      el.querySelector('.topic-head').classList.toggle('active', el.dataset.topic === topicId);
    });
  }else{
    document.querySelector(`.topic[data-topic="${topicId}"]`).classList.add('open');
  }
  currentTopic = topicId;
  currentEntry = entryId;
  document.querySelectorAll('.entry-link').forEach(el => {
    el.classList.toggle('active', el.dataset.entry === entryId);
  });

  // טעינה אופטימית: אם הערך בקאש → רינדור מיידי בלי ספינר ובלי fade-in
  if(entryCache.has(entryId)){
    const entry = entryCache.get(entryId);
    const ti = data.topics.findIndex(t => t.id === topicId);
    const topic = data.topics[ti];
    const ei = topic.entries.findIndex(e => e.id === entryId);
    renderEntryPage(topic, ti, entry, ei);
    prefetchNeighbors(topicId, ei);
    return;
  }

  // ספינר מתעכב — אם הטעינה מהירה, לא יוצג כלל (מונע פליק)
  let spinnerShown = false;
  const spinnerTimer = setTimeout(() => {
    if(currentEntry !== entryId) return;
    spinnerShown = true;
    fadeContent(`<div class="spinner-wrap"><div class="spinner"></div><div class="spinner-text">טוען…</div></div>`);
  }, 90);

  try{
    const entry = await loadEntry(entryId);
    clearTimeout(spinnerTimer);
    if(currentEntry !== entryId) return;
    const ti = data.topics.findIndex(t => t.id === topicId);
    const topic = data.topics[ti];
    const ei = topic.entries.findIndex(e => e.id === entryId);
    renderEntryPage(topic, ti, entry, ei);
    prefetchNeighbors(topicId, ei);   // קדם-טען את הסמוכים
  }catch(err){
    clearTimeout(spinnerTimer);
    console.error('Failed to load entry:', err);
    if(currentEntry === entryId){
      fadeContent(`<div class="info-page"><h1 class="info-title">שגיאה בטעינת הערך</h1><p style="color:var(--ink-faint);">${err.message}</p></div>`);
    }
  }
}

// ─── הדגשת מילות חיפוש בגוף הערך + גלילה למיקום הראשון ───
function highlightSearchInPage(query){
  const content = document.getElementById('content');
  if(!content || !query) return;

  const q      = normalizeMaleChaser(normalizeForSearch(query));
  const words  = q.split(/\s+/).filter(w => w.length >= 2);
  const wordsNoHe = words.map(stripHePrefix);
  if(!words.length) return;

  // אוסף כל צמתי-טקסט בתוכן
  const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, null);
  const textNodes = [];
  let node;
  while((node = walker.nextNode())){
    const tag = node.parentElement && node.parentElement.tagName;
    if(tag === 'SCRIPT' || tag === 'STYLE' || tag === 'MARK') continue;
    if(node.textContent.trim()) textNodes.push(node);
  }

  for(const tn of textNodes){
    const text = tn.textContent;
    const norm = normalizeMaleChaser(normalizeForSearch(text));
    const anyMatch = words.some((w, i) => norm.includes(w) || norm.includes(wordsNoHe[i]));
    if(!anyMatch) continue;

    const frag = document.createDocumentFragment();
    let last = 0;
    const re = /[א-ת]+/g;
    let m;
    while((m = re.exec(text)) !== null){
      const w     = m[0];
      const wNorm = normalizeMaleChaser(normalizeForSearch(w));
      const hit   = words.some((word, i) => wNorm.includes(word) || (wordsNoHe[i] !== word && wNorm.includes(wordsNoHe[i])));
      if(hit){
        if(m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        const mark = document.createElement('mark');
        mark.className = 'search-hl-mark';
        mark.textContent = w;
        frag.appendChild(mark);
        last = m.index + w.length;
      }
    }
    if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    tn.parentNode.replaceChild(frag, tn);
  }

  // גלילה למיקום הראשון
  setTimeout(() => {
    const first = content.querySelector('mark.search-hl-mark');
    if(first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 120);
}

// ════════════════════════════════════════════════════════════════
//  ─── מנוע חיפוש (כתיב מלא/חסר תמיד פעיל) ───
// ════════════════════════════════════════════════════════════════
const SEARCH_PAGE_SIZE = 20;
const MAX_WORDS_BETWEEN = 3;    // מקסימום מילים בין שתי מילות חיפוש עוקבות
let   searchOptAlsoContent = true;   // ברירת מחדל: גם בתוכן
let   currentSearchQuery   = "";
let   currentSearchResults = [];
let   currentSearchPage    = 1;

// ─── פונקציות נורמליזציה (port מ-mion_update_final) ───
function stripNikud(s){ return (s || '').replace(/[֑-ׇ]/g, ''); }
function normalizeForSearch(s){
  let r = stripNikud(s);
  r = r.replace(/[־\-–—]/g, ' ');
  r = r.replace(/[^\p{L}\p{N}\s]/gu, ' ');
  r = r.replace(/\s+/g, ' ').trim().toLowerCase();
  return r;
}
function normalizeMaleChaser(s){
  return (s || '').replace(/[א-ת]+/g, w => {
    if(w.length <= 3) return w;
    return w[0] + w.slice(1).replace(/[יו]/g, '');
  });
}
function stripHePrefix(w){
  return (w.length >= 3 && w[0] === 'ה') ? w.slice(1) : w;
}
const _wholeWordCache = new Map();
function isWholeWord(text, word){
  let re = _wholeWordCache.get(word);
  if(!re){
    const esc = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    re = new RegExp(`(?:^|[^\\u0590-\\u05FF])${esc}(?:$|[^\\u0590-\\u05FF])`);
    _wholeWordCache.set(word, re);
  }
  return re.test(text);
}
// ─── התאמה קפדנית: כל המילים, באותו סדר, מקסימום 3 מילים בין כל זוג עוקבות ───
// "יונתן הלך לגן" יימצא ב"יונתן [הקטן] הלך [גם הוא] לגן" — אבל לא ב"לגן הלך יונתן" (סדר הפוך)
function orderedNearMatch(text, words, wordsNoHe){
  if(!text) return false;
  if(words.length === 0) return true;
  // מילה אחת — מספיק שתופיע במשהו
  if(words.length === 1){
    const w = words[0], wNH = wordsNoHe[0];
    return text.includes(w) || (wNH !== w && text.includes(wNH));
  }

  const tokens = text.split(/[^א-ת]+/).filter(Boolean);
  if(tokens.length < words.length) return false;

  // איסוף מיקומי כל מילה ברצף הטוקנים
  const positions = [];
  for(let i = 0; i < words.length; i++){
    const w = words[i], wNH = wordsNoHe[i];
    const pos = [];
    for(let ti = 0; ti < tokens.length; ti++){
      const t = tokens[ti];
      if(t.includes(w) || (wNH !== w && t.includes(wNH))) pos.push(ti);
    }
    if(!pos.length) return false;   // מילה חסרה — אין התאמה
    positions.push(pos);
  }

  // ניסיון לבנות שרשרת: מילה i+1 חייבת לבוא אחרי i, במרחק עד MAX_WORDS_BETWEEN+1
  // (אם בין pos[i] ל-pos[i+1] יש N טוקנים אז יש N-1 מילים ביניהם → דורש pos[i+1]-pos[i] ≤ MAX_WORDS_BETWEEN+1)
  const MAX_GAP = MAX_WORDS_BETWEEN + 1;
  for(const start of positions[0]){
    let prev = start, ok = true;
    for(let wi = 1; wi < words.length; wi++){
      let found = -1;
      for(const p of positions[wi]){
        if(p > prev && p - prev <= MAX_GAP){ found = p; break; }
      }
      if(found === -1){ ok = false; break; }
      prev = found;
    }
    if(ok) return true;
  }
  return false;
}

// בודק האם קיימת לפחות כותרת או הגדרה אחת עם כל המילים בסדר הנכון ובמרחק המותר
function strictMultiWordMatch(item, words, wordsNoHe, alsoContent){
  // 1. כותרת בלבד
  if(orderedNearMatch(item.termN, words, wordsNoHe)) return true;
  // 2. כל הגדרה בנפרד
  if(alsoContent && item.defsN && Array.isArray(item.defsN)){
    for(const defText of item.defsN){
      if(orderedNearMatch(defText, words, wordsNoHe)) return true;
    }
  }
  return false;
}

// ─── חיפוש ראשי ───
function searchEntries(rawQuery, alsoContent){
  if(!searchIndex) return null;          // עדיין לא נטען
  const q = normalizeMaleChaser(normalizeForSearch(rawQuery));
  if(!q) return [];
  const words = q.split(/\s+/).filter(w => w.length > 0).slice(0, 10);
  if(!words.length) return [];
  const wordsNoHe = words.map(stripHePrefix);

  const results = [];
  for(const item of searchIndex){
    let titleScore = 0, contentScore = 0;
    let allMatched = true;

    for(let i = 0; i < words.length; i++){
      const w = words[i], wNH = wordsNoHe[i];
      let wScore = 0, foundInTitle = false;

      // התאמה בכותרת (ניקוד גבוה)
      if(item.termN.includes(w)){
        wScore += isWholeWord(item.termN, w) ? 15 : 10;
        foundInTitle = true;
      }else if(wNH !== w && item.termN.includes(wNH)){
        wScore += isWholeWord(item.termN, wNH) ? 14 : 9;
        foundInTitle = true;
      }

      // התאמה בתוכן (אם המצב מאופשר)
      if(alsoContent){
        if(item.textN.includes(w)){
          const pos = item.textN.indexOf(w);
          const posBonus = pos < 100 ? 4 : (pos < 400 ? 1 : 0);
          wScore += (isWholeWord(item.textN, w) ? 5 : 3) + posBonus;
        }else if(wNH !== w && item.textN.includes(wNH)){
          const pos = item.textN.indexOf(wNH);
          const posBonus = pos < 100 ? 3 : (pos < 400 ? 1 : 0);
          wScore += (isWholeWord(item.textN, wNH) ? 4 : 2) + posBonus;
        }
      }

      if(wScore === 0){ allMatched = false; break; }
      if(foundInTitle) titleScore += wScore;
      else             contentScore += wScore;
    }

    if(!allMatched) continue;

    // STRICT: רב-מילים — כל המילים, באותו סדר, מקסימום 3 מילים בין כל זוג, באותה כותרת או באותה הגדרה
    if(words.length > 1){
      if(!strictMultiWordMatch(item, words, wordsNoHe, alsoContent)) continue;
    }

    results.push({
      ...item,
      titleScore,
      contentScore,
      hasTitle: titleScore > 0
    });
  }

  // מיון: התאמות בכותרת קודם, אחר כך לפי ניקוד
  results.sort((a, b) => {
    if(a.hasTitle !== b.hasTitle) return a.hasTitle ? -1 : 1;
    return (b.titleScore + b.contentScore) - (a.titleScore + a.contentScore);
  });
  return results;
}

// ─── הדגשת מילים תואמות בטקסט מקדים ───
function highlightMatches(text, words, wordsNoHe){
  if(!text || !words.length) return text;
  // בנה regex אחד שמתאים לכל המילים (כולל גרסאות ה-)
  const allTerms = new Set();
  words.forEach(w => allTerms.add(w));
  wordsNoHe.forEach(w => allTerms.add(w));
  const sorted = [...allTerms].filter(t => t.length >= 2).sort((a, b) => b.length - a.length);
  if(!sorted.length) return text;
  // נורמליזציה של הטקסט לחיפוש (אבל שמירת המקור להצגה)
  // נפעיל regex על הטקסט המנורמל ונסמן מיקומים → אחר כך נמפה לטקסט המקורי
  const norm = normalizeMaleChaser(normalizeForSearch(text));
  const esc = sorted.map(s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const re = new RegExp(`(${esc.join('|')})`, 'gi');
  // מאחר שהמיפוי טקסט-מקורי↔מנורמל מורכב, נשתמש בגישה פשוטה:
  // נחלק לפי מילים בטקסט המקורי ונבדוק כל אחת
  return text.replace(/[א-ת]+/g, w => {
    const wn = normalizeMaleChaser(normalizeForSearch(w));
    for(const term of sorted){
      if(wn.includes(term) || normalizeMaleChaser(stripHePrefix(wn)).includes(term)){
        return `<span class="search-hl">${w}</span>`;
      }
    }
    return w;
  });
}

// ─── רינדור עמוד תוצאות ───
function renderSearchResults(){
  const total = currentSearchResults.length;
  const totalPages = Math.max(1, Math.ceil(total / SEARCH_PAGE_SIZE));
  if(currentSearchPage > totalPages) currentSearchPage = totalPages;
  if(currentSearchPage < 1) currentSearchPage = 1;
  setBreadcrumb(['חיפוש', `"${currentSearchQuery}"`]);

  if(searchIndex === null){
    fadeContent(`<div class="spinner-wrap"><div class="spinner"></div><div class="spinner-text">מכין חיפוש…</div></div>`);
    return;
  }
  if(total === 0){
    fadeContent(`<div class="search-no-results">לא נמצאו תוצאות עבור "<strong>${escapeHtml(currentSearchQuery)}</strong>"</div>`);
    return;
  }

  const q = normalizeMaleChaser(normalizeForSearch(currentSearchQuery));
  const words     = q.split(/\s+/).filter(Boolean);
  const wordsNoHe = words.map(stripHePrefix);

  const start = (currentSearchPage - 1) * SEARCH_PAGE_SIZE;
  const slice = currentSearchResults.slice(start, start + SEARCH_PAGE_SIZE);

  const items = slice.map(r => `
    <div class="search-result" onclick="goToEntryByEntryId('${r.id}')" onmouseenter="prefetchEntry('${r.id}')">
      <div class="search-result-head">
        <div class="search-result-term">${highlightMatches(r.term, words, wordsNoHe)}</div>
        <div class="search-result-topic">${r.topicTitle}</div>
      </div>
      <div class="search-result-preview">${highlightMatches(r.preview, words, wordsNoHe)}</div>
    </div>
  `).join('');

  const pagination = totalPages > 1 ? `
    <div class="search-pagination">
      <button class="search-pg-btn" onclick="searchPagePrev()" ${currentSearchPage === 1 ? 'disabled' : ''} title="עמוד קודם">›</button>
      <span class="search-pg-info">עמוד ${currentSearchPage} מתוך ${totalPages}</span>
      <button class="search-pg-btn" onclick="searchPageNext()" ${currentSearchPage === totalPages ? 'disabled' : ''} title="עמוד הבא">‹</button>
    </div>` : '';

  fadeContent(`
    <div class="search-results">
      <div class="search-results-meta">${total} תוצאות עבור "<strong>${escapeHtml(currentSearchQuery)}</strong>"</div>
      ${items}
      ${pagination}
    </div>
  `);
}

function searchPagePrev(){ if(currentSearchPage > 1){ currentSearchPage--; renderSearchResults(); window.scrollTo(0,0); } }
function searchPageNext(){
  const tp = Math.ceil(currentSearchResults.length / SEARCH_PAGE_SIZE);
  if(currentSearchPage < tp){ currentSearchPage++; renderSearchResults(); window.scrollTo(0,0); }
}

function escapeHtml(s){
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ─── הרצת חיפוש (debounced) ───
function runSearch(query){
  currentSearchQuery = query;
  currentSearchPage  = 1;
  if(searchIndex === null){
    renderSearchResults(); // יציג ספינר
    return;
  }
  currentSearchResults = searchEntries(query, searchOptAlsoContent) || [];
  renderSearchResults();
}

// ─── כפתור "חפש" וקיצור Enter ───
function doSearch(){
  const q = document.getElementById('search').value.trim();
  if(q){ clearTimeout(searchDebounceTimer); runSearch(q); }
}
document.getElementById('search').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); doSearch(); }
});

let searchDebounceTimer = null;
const searchInputEl = document.getElementById('search');
searchInputEl.addEventListener('input', e => {
  const q = e.target.value.trim();
  // סינון הסרגל (פידבק מיידי)
  document.querySelectorAll('.entry-link').forEach(el => {
    el.style.display = !q || el.textContent.includes(q) ? 'flex' : 'none';
  });
  if(q) document.querySelectorAll('.topic').forEach(el => el.classList.add('open'));

  // חיפוש המסך הראשי (debounced)
  clearTimeout(searchDebounceTimer);
  if(!q){
    // ריק → חזור למסך הקודם
    currentSearchQuery = "";
    if(currentEntry){
      goToEntryByEntryId(currentEntry);
    }else if(currentTopic && data && data.topics){
      const t = data.topics.find(x => x.id === currentTopic);
      if(t) renderTopicLanding(t, data.topics.indexOf(t));
    }
    return;
  }
  searchDebounceTimer = setTimeout(() => runSearch(q), 250);
});

// ─── כפתור הגדרות + פופאובר (position:fixed — מעל כל שכבה) ───
const settingsBtn  = document.getElementById('search-settings-btn');
const settingsPop  = document.getElementById('search-popover');

window.toggleSearchSettings = function(e){
  e.stopPropagation();
  if(settingsPop.classList.contains('open')){
    settingsPop.classList.remove('open');
    settingsBtn.classList.remove('active');
    return;
  }
  // מיקום: מתחת לכפתור
  const rect = settingsBtn.getBoundingClientRect();
  settingsPop.style.top  = (rect.bottom + 6) + 'px';
  settingsPop.style.right = (window.innerWidth - rect.right) + 'px';
  settingsPop.style.left  = 'auto';
  settingsPop.classList.add('open');
  settingsBtn.classList.add('active');
};

document.addEventListener('click', e => {

// ─── Bookmarks (per-entry) ───
const BOOKMARKS_KEY = 'milon_bookmarks_v1';
function getBookmarks(){
  try{ return new Set(JSON.parse(localStorage.getItem(BOOKMARKS_KEY) || '[]')); }
  catch(e){ return new Set(); }
}
function saveBookmarks(s){
  localStorage.setItem(BOOKMARKS_KEY, JSON.stringify([...s]));
}
function isBookmarked(eid){ return getBookmarks().has(eid); }
function toggleBookmark(eid){
  const s = getBookmarks();
  if(s.has(eid)) s.delete(eid); else s.add(eid);
  saveBookmarks(s);
  return s.has(eid);
}
function updateBookmarkCount(){
  const n = getBookmarks().size;
  const badge = document.getElementById('bookmarks-badge');
  if(badge){
    badge.textContent = n;
    badge.style.display = n > 0 ? 'inline-flex' : 'none';
  }
}
document.getElementById('bookmarks-page-btn').addEventListener('click', () => setPage('bookmarks'));

window.onToggleBookmark = function(eid, btn){
  const now = toggleBookmark(eid);
  if(btn) btn.classList.toggle('active', now);
  // also update sidebar marker
  document.querySelectorAll(`.entry-link[data-entry="${eid}"]`).forEach(el => {
    el.classList.toggle('bookmarked', now);
  });
};

// ─── איפוס מצב חיפוש (לפני מעבר עמוד) ───
function resetSearchState(){
  const inp = document.getElementById('search');
  if(inp) inp.value = '';
  clearTimeout(searchDebounceTimer);
  currentSearchQuery   = '';
  currentSearchResults = [];
  currentSearchPage    = 1;
  // החזר את הסרגל למצב מלא (אם הוא סונן)
  document.querySelectorAll('.entry-link').forEach(el => { el.style.display = ''; });
  // סגור פופאובר הגדרות אם פתוח
  const pop = document.getElementById('search-popover');
  const btn = document.getElementById('search-settings-btn');
  if(pop) pop.classList.remove('open');
  if(btn) btn.classList.remove('active');
}

// Page switching (about/contact)
let currentPage = 'dictionary';
function setPage(p){
  currentPage = p;
  resetSearchState();   // ← תמיד מאפס חיפוש במעבר עמוד
  document.querySelectorAll('.page-btn').forEach(b => b.classList.toggle('active', b.dataset.page === p));
  if(p === 'about'){
    setBreadcrumb(['אוצר המונחים', 'אודות']);
    fadeContent(renderAbout());
  }else if(p === 'contact'){
    setBreadcrumb(['אוצר המונחים', 'צור קשר']);
    fadeContent(renderContact());
  }else if(p === 'bookmarks'){
    setBreadcrumb(['אוצר המונחים', 'סימניות']);
    fadeContent(renderBookmarks());
  }else{
    // ─── חזרה לעמוד הראשי של המילון: איפוס מלא + הצגת המדור הראשון ───
    currentEntry = null;
    if(data && data.topics && data.topics.length){
      const t = data.topics[0];
      currentTopic = t.id;
      // סגור את כל המדורים, פתח רק את הראשון
      document.querySelectorAll('.topic').forEach(el => {
        el.classList.toggle('open', el.dataset.topic === t.id);
        const head = el.querySelector('.topic-head');
        if(head) head.classList.toggle('active', el.dataset.topic === t.id);
      });
      // הסר סימון של ערך פעיל
      document.querySelectorAll('.entry-link').forEach(el => el.classList.remove('active'));
      renderTopicLanding(t, 0);
    }
  }
}
document.querySelectorAll('.page-btn').forEach(b => {
  b.addEventListener('click', () => setPage(b.dataset.page));
});

function renderBookmarks(){
  const ids = [...getBookmarks()];
  if(!ids.length){
    return `
      <div class="info-page">
        <div class="info-eyebrow">סימניות</div>
        <h1 class="info-title">הערכים השמורים שלי</h1>

  const byTopic = {};
  items.forEach(f => {

    byTopic[f.topic.id].entries.push(f.entry);
  });

  return `
    <div class="info-page">
      <div class="info-eyebrow">סימניות</div>
      <h1 class="info-title">הערכים השמורים שלי</h1>

      ${Object.values(byTopic).map(g => `
        <div class="bookmark-group">
          <div class="bookmark-topic">${g.topic.title}</div>
          <div class="bookmark-list">
            ${g.entries.map(e => {
              // Preview נלקח מ-search-index (לא דורש load של data.json)
              const sidx = searchIndexById && searchIndexById[e.id];
              const previewRaw = sidx ? (sidx.preview || '') : '';
              const preview = previewRaw.length > 120 ? previewRaw.slice(0, 120) + '…' : previewRaw;
              return `
              <div class="bookmark-row">
                <button class="bookmark-remove" onclick="onRemoveBookmark('${e.id}')" title="הסר">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                </button>
                <div class="bookmark-content" onclick="goToEntryByEntryId('${e.id}')">
                  <div class="bookmark-term">${e.term}</div>
                  <div class="bookmark-preview">${preview}</div>
                </div>
                <span class="bookmark-arrow">←</span>
              </div>
            `;}).join('')}
          </div>
        </div>
      `).join('')}
      <div class="entry-flourish">❦ ✦ ❦</div>
    </div>
  `;
}

window.onRemoveBookmark = function(eid){
  toggleBookmark(eid);

// ─── Splitter (גרירה לשינוי רוחב הסרגל הצדדי) ───
(function setupSplitter(){
  const SPLIT_KEY = 'milon_sidebar_width_v1';
  const splitter = document.getElementById('splitter');
  if(!splitter) return;

  const MIN = 220;   // רוחב מינימום של הסרגל
  const MAX_PCT = 0.6; // עד 60% מרוחב המסך

  // שחזור רוחב שמור
  const saved = parseInt(localStorage.getItem(SPLIT_KEY) || '', 10);
  if(saved && saved >= MIN && saved <= window.innerWidth * MAX_PCT){
    document.documentElement.style.setProperty('--sidebar-width', saved + 'px');
  }

  let dragging = false;
  splitter.addEventListener('mousedown', (e) => {
    dragging = true;
    splitter.classList.add('dragging');
    document.body.classList.add('resizing');
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if(!dragging) return;
    // ב-RTL הסרגל בצד ימין; הרוחב = (innerWidth - clientX - padding)
    const padding = 16; // .page padding
    let w = window.innerWidth - e.clientX - padding;
    const max = window.innerWidth * MAX_PCT;
    if(w < MIN) w = MIN;
    if(w > max) w = max;
    document.documentElement.style.setProperty('--sidebar-width', w + 'px');
  });

  document.addEventListener('mouseup', () => {
    if(!dragging) return;
    dragging = false;
    splitter.classList.remove('dragging');
    document.body.classList.remove('resizing');
    // שמירה
    const w = getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width');
    const px = parseInt(w, 10);
    if(px) localStorage.setItem(SPLIT_KEY, px);
  });

  // double-click איפוס לברירת מחדל
  splitter.addEventListener('dblclick', () => {
    document.documentElement.style.removeProperty('--sidebar-width');
    localStorage.removeItem(SPLIT_KEY);
  });
})();

setPage('dictionary');
load();

// ── רישום Service Worker (שמירת קבצים למחשב המשתמש) ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
