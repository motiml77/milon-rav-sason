<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4a2f17" />
<title>מילון פנימיות התורה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700;900&family=Heebo:wght@300;400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700;900&family=Heebo:wght@300;400;500&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700;900&family=Heebo:wght@300;400;500&display=swap"></noscript>
<style>
  :root{
    --wood-dark: #4a2f17;
    --wood: #6b4520;
    --wood-warm: #8b6428;
    --wood-light: #c9a060;
    --cream: #f8f0dc;
    --cream-2: #efe4c8;
    --cream-3: #e2d3b0;
    --gold: #b8893a;
    --gold-bright: #e2b558;
    --gold-deep: #8a6018;
    --ink: #2a1a08;
    --ink-soft: #5a3e1e;
    --ink-faint: #8a6e48;
    --crimson: #8b2e1c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{height:100%; overflow:hidden;}
  body{
    font-family: 'Frank Ruhl Libre', 'David Libre', serif;
    color: var(--ink);
    background:
      linear-gradient(135deg, #2a1808 0%, #4a2f17 100%);
    direction: rtl;
    font-size: 16px;
    line-height: 1.7;
  }

  .page{
    display: grid;
    grid-template-columns: var(--sidebar-width, 340px) 6px 1fr;
    height: 100vh;              /* fallback לדפדפנים ישנים */
    height: 100dvh;             /* גובה חלון דינמי — לא נחתך כשסרגל הכתובת במובייל מוצג */
    padding: 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    padding-left:  max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    gap: 0;
    min-height: 0;
  }

  /* ─── Splitter (גרירה לשינוי פרופורציה בין סרגל וחלון) ─── */
  .splitter{
    cursor: col-resize;
    position: relative;
    background: transparent;
    transition: background 0.15s;
    z-index: 10;
  }
  .splitter::before{
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 4px;
    height: 60px;
    background: var(--gold);
    border-radius: 2px;
    opacity: 0.55;
    transition: opacity 0.15s, background 0.15s;
  }
  .splitter:hover::before{ opacity: 1; background: var(--gold-bright); }
  .splitter:focus-visible{ outline: none; }
  .splitter:focus-visible::before{ opacity: 1; background: var(--crimson); height: 120px; }
  .splitter.dragging::before{ opacity: 1; background: var(--crimson); }
  body.resizing{ cursor: col-resize; user-select: none; }
  body.resizing iframe, body.resizing *{ pointer-events: none; }
  body.resizing .splitter{ pointer-events: auto; }

  /* ─── Sidebar ─── */
  .sidebar{
    position: relative;
    background:
      linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    border-radius: 0 8px 8px 0;   /* RTL: הסרגל בימין — הפינות המעוגלות בחוץ */
    box-shadow:
      0 12px 40px rgba(0,0,0,0.5),
      inset 0 0 0 1px rgba(184, 137, 58, 0.3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar::before{
    content: "";
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(180deg,
        transparent 0px, transparent 2px,
        rgba(120,80,30,0.03) 2px, rgba(120,80,30,0.03) 3px);
    pointer-events: none;
  }
  .brand{
    padding: 13px 12px 9px;
    text-align: center;
    border-bottom: 1px double var(--gold-deep);
    position: relative;
  }
  .brand-emblem{
    width: 48px; height: auto;
    margin: 0 auto 5px;
    display: block;
    filter: drop-shadow(0 2px 3px rgba(90,30,16,0.2));
  }
  .brand-title{
    font-weight: 900;
    color: var(--ink);
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .brand-subtitle{
    color: var(--gold-deep);
    font-size: 9px;
    letter-spacing: 0.25em;
  }
  .brand-tagline{
    margin-top: 8px;
    font-size: 10px;
    color: var(--crimson);
    letter-spacing: 0.4em;
    font-weight: 700;
    font-style: italic;
    opacity: 0.75;
  }

  /* ─── תיבת חיפוש מאוחדת ─── */
  .search-wrap{
    margin: 16px 18px 8px;
    position: relative;
    z-index: 10;
  }
  .search{
    display: flex;
    flex-direction: row;
    align-items: stretch;
    background: rgba(255,255,255,0.65);
    border: 1.5px solid var(--gold-deep);
    border-radius: 5px;
    overflow: hidden;
    transition: box-shadow 0.15s;
  }
  .search:focus-within{
    box-shadow: 0 0 0 2px var(--gold-bright);
    background: rgba(255,255,255,0.85);
  }
  .search-icon{
    flex-shrink: 0;
    padding: 0 9px;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    pointer-events: none;
  }
  .search input{
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    color: var(--ink);
    padding: 9px 2px 9px 0;
    font-family: inherit;
    font-size: 14px;
    direction: rtl;
    outline: none;
  }
  .search input::placeholder{ color: var(--ink-faint); }
  .search-go-btn{
    flex-shrink: 0;
    background: var(--gold-deep);
    border: none;
    border-right: 1.5px solid var(--gold-deep);
    color: var(--cream);
    cursor: pointer;
    padding: 0 13px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
    display: flex;
    align-items: center;
    transition: background 0.15s;
  }
  .search-go-btn:hover{ background: var(--wood-dark); }
  .search-settings-btn{
    flex-shrink: 0;
    background: transparent;
    border: none;
    border-right: 1px solid rgba(184,137,58,0.35);
    color: var(--ink-faint);
    cursor: pointer;
    padding: 0 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, background 0.15s;
  }
  .search-settings-btn:hover{ color: var(--gold-deep); background: rgba(184,137,58,0.08); }
  .search-settings-btn.active{ color: var(--gold-deep); background: rgba(184,137,58,0.12); }
  .search-popover{
    display: none;
    position: fixed;
    background: var(--cream);
    border: 1px solid var(--gold-deep);
    border-radius: 6px;
    padding: 10px 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    z-index: 9999;
    font-size: 13px;
    min-width: 180px;
  }
  .search-popover.open{ display: block; }
  .search-option{
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    color: var(--ink);
    padding: 4px 0;
  }
  .search-option input[type="radio"]{ accent-color: var(--gold-deep); }
  .search-option-hint{
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dotted var(--gold);
    font-size: 11px;
    color: var(--ink-faint);
    font-style: italic;
  }

  /* ─── עמוד תוצאות חיפוש ─── */
  .search-results{ padding: 8px 0 32px; }
  .search-results-meta{
    font-size: 14px;
    color: var(--ink-faint);
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px dotted var(--gold);
    letter-spacing: 0.04em;
  }
  .search-result{
    padding: 16px 8px;
    border-bottom: 1px dotted var(--gold);
    cursor: pointer;
    transition: background 0.15s;
  }
  .search-result:hover{ background: rgba(184,137,58,0.06); }
  .search-result-head{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }
  .search-result-term{
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.3;
  }
  .search-result-topic{
    font-size: 11px;
    color: var(--gold-deep);
    background: var(--cream-2);
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  .search-result-deflabel{
    display: inline-block;
    font-size: 11px;
    color: var(--gold-deep);
    background: rgba(184,137,58,0.1);
    border-radius: 3px;
    padding: 1px 6px;
    margin-left: 6px;
    font-weight: 700;
    letter-spacing: 0.02em;
    vertical-align: middle;
  }
  .search-result-preview{
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.65;
    text-align: justify;
  }
  .search-hl{
    background: linear-gradient(180deg, transparent 50%, #f0dfa0 50%);
    padding: 0 1px;
    border-radius: 1px;
    font-weight: 600;
    color: var(--ink);
  }
  /* מרקר בדף הערך עצמו — בז' עם אנימציית הבהוב */
  mark.search-hl-mark{
    background: #fde68a;
    color: var(--ink);
    border-radius: 3px;
    padding: 1px 2px;
    font-weight: 700;
    box-shadow: 0 0 0 2px #f59e0b44;
    animation: hl-pulse 1.4s ease-out 3;
  }
  @keyframes hl-pulse{
    0%,100%{ background:#fde68a; box-shadow:0 0 0 2px #f59e0b44; }
    50%{ background:#fbbf24; box-shadow:0 0 0 5px #f59e0b55; }
  }
  .search-no-results{
    text-align: center;
    padding: 80px 0;
    color: var(--ink-faint);
    font-size: 16px;
  }
  .search-pagination{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px dotted var(--gold);
  }
  .search-pg-btn{
    background: var(--cream-2);
    border: 1px solid var(--gold-deep);
    color: var(--ink);
    width: 32px; height: 32px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .search-pg-btn:hover:not(:disabled){ background: var(--cream-3); }
  .search-pg-btn:disabled{ opacity: 0.35; cursor: default; }
  .search-pg-info{
    color: var(--ink-faint);
    font-size: 13px;
    letter-spacing: 0.04em;
  }

  .nav{
    flex: 1;
    overflow-y: auto;
    padding: 8px 16px 20px;
  }
  .nav::-webkit-scrollbar{ width: 6px; }
  .nav::-webkit-scrollbar-thumb{ background: var(--gold-deep); border-radius: 3px; }

  .topic{ margin-bottom: 8px; position: relative; }
  .topic-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    cursor: pointer;
    background: rgba(255,255,255,0.4);
    border: 1px solid var(--gold-deep);
    transition: all 0.15s;
    user-select: none;
    position: relative;
  }
  .topic-head::before{
    content: "";
    position: absolute;
    right: -8px; top: 50%;
    transform: translateY(-50%) rotate(45deg);
    width: 14px; height: 14px;
    background: var(--cream);
    border: 1px solid var(--gold-deep);
    border-left: none;
    border-bottom: none;
    z-index: 0;
  }
  .topic-head:hover{ background: rgba(212,176,106, 0.3); }
  .topic-head.active{
    background: var(--ink);
    color: var(--cream);
    border-color: var(--ink);
  }
  .topic-head.active::before{
    background: var(--ink);
    border-color: var(--ink);
  }
  .topic-head.active .topic-subtitle{ color: var(--gold-bright); }
  .topic-title{
    font-weight: 700;
    font-size: 18px;
    position: relative;
    z-index: 1;
  }
  .topic-subtitle{
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 3px;
    letter-spacing: 0.04em;
    position: relative;
    z-index: 1;
  }
  .topic-count{
    background: var(--gold);
    color: var(--cream);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    min-width: 22px;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .topic-head.active .topic-count{ background: var(--gold-bright); color: var(--ink); }

  .entries{
    overflow: hidden;
    max-height: 0;
    /* אין transition: הרשימה בגובה ~30,000px, אנימציה על max-height רק גורמת לקפיצה */
    padding: 0 8px;
  }
  /* גובה מספיק גדול שיכיל גם מדורים עם מאות ערכים — הגלילה נשארת ב-.nav */
  .topic.open .entries{ max-height: none; padding-top: 6px; padding-bottom: 6px;}

  .entry-link{
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 6px 12px;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 15px;
    border-right: 2px solid transparent;
    transition: all 0.15s;
    user-select: none;
    position: relative;
  }
  .entry-link::before{
    content: attr(data-num);
    color: var(--gold);
    font-size: 11px;
    font-weight: 700;
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }
  .entry-link:hover{ color: var(--ink); background: rgba(255,255,255,0.4); }
  .entry-link.active{
    color: var(--crimson);
    border-right-color: var(--crimson);
    background: rgba(139,46,28, 0.08);
    font-weight: 700;
  }
  .entry-link.bookmarked::after{
    content: "";
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 7px;
    height: 9px;
    background: var(--crimson);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%);
    opacity: 0.85;
  }

  /* ─── Main ─── */
  .main{
    position: relative;
    background:
      linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    border-radius: 8px 0 0 8px;   /* RTL: התוכן בשמאל */
    box-shadow:
      0 12px 40px rgba(0,0,0,0.5),
      inset 0 0 0 1px rgba(184, 137, 58, 0.3);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-width: 0;           /* מאפשר כיווץ בתוך grid */
  }
  .main::before{
    content: "";
    position: absolute;
    top: 0; bottom: 0; right: 0;
    width: 12px;
    background: linear-gradient(270deg, transparent, rgba(0,0,0,0.15));
    pointer-events: none;
    z-index: 5;
  }
  .main::after{
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(184,137,58,0.04) 0%, transparent 30%),
      radial-gradient(circle at 80% 70%, rgba(184,137,58,0.04) 0%, transparent 30%);
    pointer-events: none;
  }

  .topbar{
    height: 56px;
    flex-shrink: 0;
    border-bottom: 2px double var(--gold-deep);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 36px;
    position: relative;
    z-index: 2;
    overflow: hidden;          /* מונע גלישת טקסט מהסרגל */
  }
  .breadcrumb{
    color: var(--ink-soft);
    font-size: 14px;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 8px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .breadcrumb > span{ min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .breadcrumb-sep{ flex: 0 0 auto; }
  .breadcrumb-current{ color: var(--ink); font-weight: 700; flex: 1 1 auto; }
  .breadcrumb-sep{ color: var(--gold-deep); }

  .sidebar-pages{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    padding: 0 12px 12px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--gold);
  }
  .page-btn{
    background: transparent;
    border: none;
    border-left: 1px solid var(--gold);
    color: var(--ink-soft);
    padding: 10px 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }
  .page-btn:last-child{ border-left: none; }
  .page-btn svg{ color: var(--gold-deep); transition: color 0.15s; }
  .page-btn:hover{
    color: var(--ink);
    background: rgba(184,137,58, 0.08);
  }
  .page-btn:hover svg{ color: var(--crimson); }
  .page-btn.active{
    color: var(--crimson);
  }
  .page-btn.active svg{ color: var(--crimson); }

  .toolbar{
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }
  .tool-btn{
    background: rgba(255,255,255,0.5);
    border: 1px solid var(--gold);
    color: var(--gold-deep);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s ease;
    font-family: inherit;
    position: relative;
  }
  .tool-btn:hover{
    background: var(--cream);
    color: var(--ink);
    border-color: var(--gold-deep);
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(138,96,24, 0.2);
  }
  .tool-btn.active{
    background: linear-gradient(180deg, var(--crimson), #6e1f11);
    color: var(--gold-bright);
    border-color: #6e1f11;
    box-shadow: 0 2px 6px rgba(139,46,28, 0.35), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .tool-btn svg{ display: block; }

  .scroll-area{
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0;
    position: relative;
    z-index: 1;
  }
  .scroll-area::-webkit-scrollbar{ width: 8px; }
  .scroll-area::-webkit-scrollbar-thumb{ background: var(--gold-deep); border-radius: 4px; }

  .content{
    max-width: 800px;
    margin: 0 auto;
    padding: 50px 60px 80px;
    position: relative;
    min-height: 100%;
    overflow-wrap: break-word;
    word-wrap: break-word;
  }
  @media (max-width: 900px){
    .content{ padding: 30px 24px 60px; }
  }

  /* ─── Spinner (טעינת ערך) ─── */
  .spinner-wrap{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px 0;
    gap: 20px;
  }
  .spinner{
    width: 40px; height: 40px;
    border: 3px solid var(--cream-3);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .spinner-text{
    font-size: 0.95em;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
  }

  /* fade animation for content swap */
  .fade-stage{
    animation: fadeIn 250ms ease both;
  }
  @keyframes fadeIn{
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Topic landing (when no entry chosen yet) */
  .topic-landing{
    text-align: center;
    padding-top: 40px;
  }
  .topic-landing-eyebrow{
    color: var(--gold-deep);
    font-size: 11px;
    letter-spacing: 0.4em;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .topic-landing-title{
    font-size: 64px;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: 0.01em;
    margin-bottom: 8px;
    line-height: 1;
  }
  .topic-landing-subtitle{
    font-size: 17px;
    color: var(--ink-soft);
    font-style: italic;
    margin-top: 8px;
  }
  .topic-landing-rule{
    width: 60%;
    margin: 28px auto 36px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent);
    position: relative;
  }
  .topic-landing-rule::after{
    content: "✦";
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    background: var(--cream);
    color: var(--gold);
    padding: 0 16px;
    font-size: 16px;
  }
  .topic-landing-hint{
    color: var(--ink-faint);
    font-size: 15px;
    font-style: italic;
    letter-spacing: 0.04em;
  }
  .entry-grid{
    margin-top: 36px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr));
    gap: 8px;
    text-align: right;
  }
  .entry-card{
    padding: 10px 14px 12px;
    background: rgba(255,255,255,0.5);
    border: 1px solid var(--gold);
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    min-width: 0;
  }
  .entry-card:hover{
    background: var(--ink);
    color: var(--cream);
    border-color: var(--ink);
  }
  .entry-card-num{
    color: var(--gold-deep);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.18em;
    margin-bottom: 3px;
  }
  .entry-card:hover .entry-card-num{ color: var(--gold-bright); }
  .entry-card-term{
    font-size: 17px;
    font-weight: 900;
    color: inherit;
    line-height: 1.2;
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  /* Entry layout — single entry per page */
  .entry-page{
    position: relative;
  }
  .entry-page-header{
    margin-bottom: 36px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--gold);
    position: relative;
  }
  .entry-page-header::after{
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -3px;
    height: 1px;
    background: var(--gold);
  }
  .entry-eyebrow{
    color: var(--gold-deep);
    font-size: 11px;
    letter-spacing: 0.4em;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .entry-eyebrow::after{
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--gold), transparent);
    opacity: 0.5;
  }
  .entry-term{
    font-size: clamp(28px, 5vw, 56px);
    font-weight: 900;
    color: var(--ink);
    letter-spacing: 0.01em;
    line-height: 1.05;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 18px;
    overflow-wrap: break-word;
    word-wrap: break-word;
  }
  .entry-bookmark{
    background: transparent;
    border: 1.5px solid var(--gold);
    color: var(--gold-deep);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s ease;
    flex-shrink: 0;
    align-self: center;
    margin-top: 6px;
  }
  .entry-bookmark:hover{
    background: var(--cream);
    border-color: var(--crimson);
    color: var(--crimson);
    transform: translateY(-1px) scale(1.05);
  }
  .entry-bookmark.active{
    background: var(--crimson);
    border-color: var(--crimson);
    color: var(--gold-bright);
    box-shadow: 0 3px 8px rgba(139,46,28, 0.3);
  }
  .entry-bookmark.active svg{ fill: currentColor; }
  .entry-topic-label{
    font-size: 14px;
    color: var(--ink-faint);
    font-style: italic;
    letter-spacing: 0.03em;
  }

  .definition{
    position: relative;
  }
  /* רווח קטן בין פסקאות המשכיות (אותה הגדרה לוגית) */
  .definition + .definition{
    margin-top: 10px;
  }
  /* קו מפריד + רווח גדול לפני התחלה של הגדרה חדשה (אחרי מקור) */
  .definition.new-block{
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px dotted var(--gold);
  }
  .definition.first .definition-text::first-letter{
    float: right;
    font-size: 64px;
    line-height: 0.9;
    font-weight: 900;
    color: var(--crimson);
    margin-left: 8px;
    margin-top: 4px;
    margin-right: -2px;
    font-family: 'Frank Ruhl Libre', serif;
  }
  .definition-text{
    font-size: 19px;
    line-height: 1.95;
    color: var(--ink);
    text-align: justify;
    text-justify: inter-word;
  }
  .source-line{
    margin-top: 18px;
    display: flex;
    justify-content: flex-end;
  }
  .source{
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    padding: 4px 0;
    border-bottom: 1px solid var(--gold);
    font-style: italic;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .source::before{
    content: "✦";
    color: var(--gold);
    font-style: normal;
  }

  .related{
    margin-top: 36px;
    padding: 16px 20px;
    background:
      linear-gradient(180deg, rgba(184,137,58, 0.10), rgba(184,137,58, 0.04));
    border: 1px solid var(--gold);
    border-right: 4px solid var(--crimson);
    position: relative;
  }
  .related::before{
    content: "";
    position: absolute;
    top: -1px; left: -1px;
    width: 16px; height: 16px;
    border-top: 2px solid var(--gold);
    border-left: 2px solid var(--gold);
  }
  .related::after{
    content: "";
    position: absolute;
    bottom: -1px; right: -1px;
    width: 16px; height: 16px;
    border-bottom: 2px solid var(--gold);
    border-right: 2px solid var(--gold);
  }
  .related-header{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px dotted var(--gold);
  }
  .related-icon{
    color: var(--crimson);
    flex-shrink: 0;
  }
  .related-label{
    font-size: 11px;
    color: var(--gold-deep);
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }
  .related-sublabel{
    font-size: 11px;
    color: var(--ink-faint);
    font-style: italic;
    margin-right: auto;
  }
  .related-list{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .related-link{
    color: var(--ink);
    cursor: pointer;
    padding: 4px 10px 4px 8px;
    background: rgba(255,255,255,0.55);
    border: 1px solid var(--gold);
    border-radius: 999px;
    font-size: 13px;
    line-height: 1.3;
    transition: all 0.18s;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    position: relative;
    overflow: hidden;
    white-space: nowrap;
  }
  .related-link::before{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(270deg, var(--crimson), transparent);
    transform: translateX(100%);
    transition: transform 0.25s ease;
    z-index: 0;
  }
  .related-link > *{ position: relative; z-index: 1; }
  .related-link:hover{
    color: var(--cream);
    border-color: var(--crimson);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(139,46,28, 0.25);
  }
  .related-link:hover::before{ transform: translateX(0); }
  .related-link-arrow{
    color: var(--crimson);
    font-size: 12px;
    flex-shrink: 0;
    transition: transform 0.2s;
  }
  .related-link:hover .related-link-arrow{
    color: var(--gold-bright);
    transform: translateX(-4px);
  }
  .related-link-topic{
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
    font-weight: 500;
    border-right: 1px solid var(--gold);
    padding-right: 6px;
    margin-right: 2px;
  }
  .related-link:hover .related-link-topic{ color: var(--gold-bright); }
  .related-link-text{
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
  }

  .entry-flourish{
    text-align: center;
    margin-top: 44px;
    color: var(--gold);
    font-size: 22px;
    letter-spacing: 0.5em;
    opacity: 0.7;
  }


  /* Rabbi card */
  .rabbi-card{
    display: grid;
    grid-template-columns: minmax(0, 200px) 1fr;
    gap: 28px;
    margin: 32px 0 40px;
    padding: 24px;
    background: linear-gradient(135deg, rgba(255,255,255,0.6), rgba(244,230,196,0.4));
    border: 1px solid var(--gold);
    border-right: 4px solid var(--crimson);
    align-items: start;
  }
  @media (max-width: 650px){
    .rabbi-card{
      grid-template-columns: 1fr;
      justify-items: center;
      text-align: center;
    }
  }
  .rabbi-portrait{
    width: 100%;
    max-width: 200px;
    aspect-ratio: 200/240;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(58,38,20,0.25), inset 0 0 0 4px var(--cream);
  }
  .rabbi-portrait svg{ display: block; width: 100%; height: 100%; }
  .rabbi-details{ padding-top: 4px; }
  .rabbi-name{
    font-size: 28px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.1;
    margin-bottom: 6px;
  }
  .rabbi-role{
    font-size: 13px;
    color: var(--gold-deep);
    letter-spacing: 0.05em;
    font-weight: 700;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px dotted var(--gold);
  }
  .rabbi-bio{
    font-size: 15px;
    line-height: 1.85;
    color: var(--ink);
    text-align: justify;
    margin-bottom: 14px;
  }
  .rabbi-tags{
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .rabbi-tag{
    background: var(--cream);
    border: 1px solid var(--gold);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  /* Bookmarks page */
  .empty-bookmarks{
    text-align: center;
    padding: 50px 30px;
    color: var(--ink-faint);
  }
  .empty-bookmarks svg{
    color: var(--gold);
    margin-bottom: 20px;
    opacity: 0.6;
  }
  .empty-bookmarks p{
    font-size: 15px;
    line-height: 1.8;
    color: var(--ink-soft);
  }
  .bookmark-group{
    margin-bottom: 32px;
  }
  .bookmark-topic{
    font-size: 13px;
    color: var(--gold-deep);
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding-bottom: 8px;
    margin-bottom: 14px;
    border-bottom: 1px dotted var(--gold);
  }
  .bookmark-list{
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bookmark-row{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: rgba(255,255,255,0.5);
    border: 1px solid var(--gold);
    border-right: 3px solid var(--gold-deep);
    transition: all 0.15s;
  }
  .bookmark-row:hover{
    border-right-color: var(--crimson);
    background: rgba(255,255,255,0.85);
    transform: translateX(-2px);
  }
  .bookmark-remove{
    background: transparent;
    border: none;
    color: var(--crimson);
    cursor: pointer;
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border-radius: 50%;
    transition: all 0.15s;
  }
  .bookmark-remove:hover{ background: rgba(139,46,28, 0.12); }
  .bookmark-content{
    flex: 1;
    cursor: pointer;
    min-width: 0;
  }
  .bookmark-term{
    font-size: 22px;
    font-weight: 900;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .bookmark-preview{
    font-size: 13px;
    color: var(--ink-faint);
    line-height: 1.5;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
  }
  .bookmark-arrow{
    color: var(--gold-deep);
    font-size: 18px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .bookmark-row:hover .bookmark-arrow{ color: var(--crimson); }

  /* Info pages (About / Contact) */
  .info-page{
    text-align: right;
    padding-top: 20px;
  }
  .info-eyebrow{
    color: var(--gold-deep);
    font-size: 11px;
    letter-spacing: 0.4em;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 12px;
    text-align: center;
  }
  .info-title{
    font-size: clamp(28px, 5vw, 56px);
    font-weight: 900;
    color: var(--ink);
    text-align: center;
    line-height: 1.05;
    margin-bottom: 8px;
    overflow-wrap: break-word;
  }
  .info-subtitle{
    font-size: 16px;
    color: var(--ink-soft);
    font-style: italic;
    text-align: center;
  }
  .info-rule{
    width: 60%;
    margin: 28px auto 36px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent);
    position: relative;
  }
  .info-rule::after{
    content: "✦";
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    background: var(--cream);
    color: var(--gold);
    padding: 0 16px;
    font-size: 16px;
  }
  .info-section{ margin-bottom: 28px; }
  .info-h2{
    font-size: 22px;
    font-weight: 900;
    color: var(--crimson);
    margin-bottom: 10px;
    padding-right: 14px;
    border-right: 3px solid var(--gold);
  }
  .info-p{
    font-size: 17px;
    line-height: 1.9;
    color: var(--ink);
    text-align: justify;
  }
  .contact-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr));
    gap: 14px;
    margin-top: 20px;
  }
  .contact-card{
    padding: 22px 18px;
    background: rgba(255,255,255,0.5);
    border: 1px solid var(--gold);
    text-align: center;
    transition: all 0.15s;
  }
  .contact-card:hover{
    background: rgba(255,255,255,0.8);
    border-color: var(--crimson);
    transform: translateY(-2px);
  }
  .contact-icon{
    color: var(--crimson);
    margin-bottom: 10px;
  }
  .contact-label{
    color: var(--gold-deep);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .contact-value{
    color: var(--ink);
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
  }
  a.contact-value:hover{ color: var(--crimson); }

  body[data-font="lg"] .definition-text{ font-size: 21px; }
  body[data-font="xl"] .definition-text{ font-size: 24px; }

  /* טקסט קטן — הערות בסוגריים עגולים והפניות פנימיות */
  .definition-text .text-small,
  .text-small{
    font-size: 0.78em;
    color: var(--ink-soft);
    opacity: 0.92;
  }

  /* ציטוטים מתוך מקור — פסקאות שמסומנו בגופן/גודל שונה ב-Word */
  .definition-text .quote{
    display: block;
    font-family: 'Heebo', 'Assistant', sans-serif;
    font-weight: 300;
    font-size: 0.92em;
    line-height: 1.85;
    color: var(--ink-soft);
    background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(244,230,196,0.30));
    border-right: 3px solid var(--gold);
    border-radius: 0 4px 4px 0;
    padding: 14px 22px 14px 22px;
    margin: 16px 0 16px 8px;
    position: relative;
    text-align: justify;
  }
  /* קישוט עדין: ✦ קטן בפינה */
  .definition-text .quote::before{
    content: "✦";
    position: absolute;
    right: 6px;
    top: 6px;
    font-size: 11px;
    color: var(--gold);
    opacity: 0.55;
    line-height: 1;
    pointer-events: none;
  }
  /* טקסט קטן בתוך ציטוט — שומר על האווירה אבל מעט יותר קטן */
  .definition-text .quote .text-small{
    font-size: 0.82em;
    opacity: 0.85;
  }
  body[data-font="lg"] .definition-text .quote{ font-size: 0.94em; }
  body[data-font="xl"] .definition-text .quote{ font-size: 0.95em; }

  /* ═══════════════════════════════════════════════════════════════
     מובייל / מסך צר — הסרגל הופך למגירה נשלפת
     ═══════════════════════════════════════════════════════════════ */
  /* ─── לשוניות ─── */
  .tabbar{
    display: none;
    align-items: stretch;
    gap: 0;
    flex-shrink: 0;
    border-bottom: 1px solid var(--gold);
    background: rgba(255,255,255,0.35);
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .tabbar.show{ display: flex; }
  .tabbar::-webkit-scrollbar{ height: 4px; }
  .tabbar::-webkit-scrollbar-thumb{ background: var(--gold); border-radius: 2px; }
  .tab{
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 10px 7px 6px;
    border: none;
    border-left: 1px solid rgba(184,137,58,0.4);
    background: transparent;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    max-width: 190px;
    flex: 0 0 auto;
    transition: background 0.15s, color 0.15s;
  }
  .tab:hover{ background: rgba(184,137,58,0.1); }
  .tab.active{
    background: var(--cream);
    color: var(--ink);
    font-weight: 700;
    box-shadow: inset 0 -2px 0 var(--crimson);
  }
  .tab-label{ overflow: hidden; text-overflow: ellipsis; }
  .tab-close{
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 2px 3px;
    border-radius: 3px;
    flex: 0 0 auto;
  }
  .tab-close:hover{ background: var(--crimson); color: var(--cream); }
  .tab-new{
    border: none;
    border-left: 1px solid rgba(184,137,58,0.4);
    background: transparent;
    color: var(--gold-deep);
    font-size: 19px;
    line-height: 1;
    padding: 0 13px;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .tab-new:hover{ background: var(--gold); color: var(--cream); }

  .related-newtab{
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 3px;
    flex: 0 0 auto;
  }
  .related-newtab:hover{ background: var(--gold); color: var(--cream); }

  /* ─── ערכים קשורים בהקשר ─── */
  .ctx-block{
    margin-top: 30px;
    padding-top: 18px;
    border-top: 1px dashed var(--gold);
  }
  .ctx-head{
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .ctx-title{
    font-weight: 700;
    color: var(--ink);
    font-size: 15px;
    letter-spacing: 0.03em;
  }
  .ctx-sub{ color: var(--ink-faint); font-size: 12px; }
  .ctx-list{ display: flex; flex-wrap: wrap; gap: 8px; }
  .ctx-item{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(255,255,255,0.55);
    border: 1px solid var(--gold);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    padding: 7px 13px;
    border-radius: 3px;
    cursor: pointer;
    text-align: right;
    transition: background 0.15s, color 0.15s;
  }
  .ctx-item:hover{ background: var(--gold-deep); color: var(--cream); }
  .ctx-count{
    background: var(--gold);
    color: var(--cream);
    font-size: 11px;
    font-weight: 700;
    min-width: 17px;
    height: 17px;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .ctx-item:hover .ctx-count{ background: var(--cream); color: var(--gold-deep); }

  .sr-only{
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .search-hint-words{
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
  }
  .search-hint-word{
    background: rgba(255,255,255,0.6);
    border: 1px solid var(--gold);
    color: var(--ink);
    font-family: inherit;
    font-size: 15px;
    padding: 6px 14px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .search-hint-word:hover{ background: var(--gold-deep); color: var(--cream); }

  .nav-toggle{ display: none; }
  .nav-backdrop{ display: none; }

  @media (max-width: 860px){
    .page{
      grid-template-columns: 1fr;
      padding: 0;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .splitter{ display: none; }

    .sidebar{
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: min(88vw, 380px);
      border-radius: 0;
      z-index: 60;
      transform: translateX(101%);

      visibility: hidden;

<script>
const TERMS_URL   = "terms.json";
const SEARCH_URL  = "search-index.json?v=2026-09-01-125130"; // AUTO_VERSION
const ENTRY_URL_PREFIX = "entries/";
const DATA_VERSION = SEARCH_URL.split('?v=')[1] || '';
// גרסת הקוד — יש להעלות אותה כששינוי בקוד משנה את מבנה האינדקס הבנוי בזיכרון,
// אחרת משתמש חוזר יטען מ-IndexedDB מבנה שנבנה ע"י גרסה ישנה.
const INDEX_CODE_VERSION = 'v4-abbrev-fuzzy';

let data          = null;   // terms.json — הסרגל הצדדי
let searchData    = null;   // search-index.json — { topics, entries }
let searchIx      = null;   // האינדקס ההפוך הבנוי בזיכרון
let searchById    = null;   // id → { entry, idx }
let currentTopic  = null;
let currentEntry  = null;
const entryCache    = new Map();
const entryInflight = new Map();   // מונע סופת בקשות בריחוף על רשימת 653 הערכים

// ─── אחסון מקומי בטוח ───
// localStorage זורק SecurityError בגלישה פרטית / כשחסומים נתוני אתר.
// לפני התיקון, קריאה לא-מוגנת ב-setupSplitter הפילה את כל הסקריפט לפני load().
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

// ─── טעינת ערך בודד (עם cache + מיזוג בקשות במעוף) ───
async function loadEntry(id){
  if(entryCache.has(id)) return entryCache.get(id);
  const pending = entryInflight.get(id);
  if(pending) return pending;
  const url = ENTRY_URL_PREFIX + id + '.json' + (DATA_VERSION ? '?v=' + DATA_VERSION : '');
  const p = fetch(url)
    .then(res => { if(!res.ok) throw new Error('טעינת ערך ' + id + ' נכשלה (' + res.status + ')'); return res.json(); })
    .then(entry => { entryCache.set(id, entry); entryInflight.delete(id); return entry; })
    .catch(err => { entryInflight.delete(id); throw err; });
  entryInflight.set(id, p);
  return p;
}

// ════════════════════════════════════════════════════════════════════
//  מנוע חיפוש עברי — טוקניזציה, אינדקס הפוך, דירוג
//  כל הנרמול קורה כאן בלבד. Python מספק טקסט נקי בלבד, כך שאין יותר
//  שתי מימושי-נרמול שיכולים להיפרד זה מזה.
// ════════════════════════════════════════════════════════════════════
const SOF_MAP = { 'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ' };
const SOF_RE  = /[ךםןףץ]/g;
const NIKUD_RE = /[֑-ׇ]/;
const NIKUD_ALL = /[֑-ׇ]/g;

function isWordCode(c){
  return (c >= 0x5d0 && c <= 0x5ea) || (c >= 48 && c <= 57) || (c >= 65 && c <= 90) || (c >= 97 && c <= 122);
}
function isSofitCode(c){ return c===0x5da||c===0x5dd||c===0x5df||c===0x5e3||c===0x5e5; }
function isHebCode(c){ return c >= 0x5d0 && c <= 0x5ea; }
// גרשיים בתוך מילה עברית = קיצור (נרנח"י, א"א, בי"ע), לא גבול מילה.
function isGershCode(c){ return c === 0x22 || c === 0x5f4; }   // רק גרשיים מסמן קיצור
const GERSH_RE = /["״]/g;   // גרש בודד (') הוא מרכאות בקורפוס הזה, לא קיצור

// סריקה אחת: מסיר ניקוד, מקפל אותיות סופיות (ם→מ, ן→נ …), מפריד על תו לא-מילה.
// קיפול אותיות סופיות הוא התיקון שגורם ל"תיקון" למצוא את "תיקונים".
function tokenize(s, flags){
  const out = [];
  if(!s) return out;
  if(NIKUD_RE.test(s)) s = s.replace(NIKUD_ALL, '');
  const n = s.length;
  let i = 0;
  while(i < n){
    const c = s.charCodeAt(i);
    if(!isWordCode(c)){ i++; continue; }
    let j = i + 1, sof = isSofitCode(c), up = c >= 65 && c <= 90, gersh = false;
    while(j < n){
      const d = s.charCodeAt(j);
      if(isGershCode(d)){
        // שמור את הגרשיים בתוך המילה רק אם הוא חסום משני צדיו באות עברית
        if(isHebCode(s.charCodeAt(j - 1)) && isHebCode(s.charCodeAt(j + 1))){ gersh = true; j++; continue; }
        break;
      }
      if(!isWordCode(d)) break;
      if(isSofitCode(d)) sof = true;
      if(d >= 65 && d <= 90) up = true;
      j++;
    }
    let t = s.slice(i, j);
    if(gersh) t = t.replace(GERSH_RE, '');
    if(sof) t = t.replace(SOF_RE, ch => SOF_MAP[ch]);
    if(up)  t = t.toLowerCase();
    out.push(t);
    if(flags) flags.push(gersh);
    i = j;
  }
  return out;
}

// כתיב מלא/חסר: משמיט י/ו אחרי האות הראשונה. משמש רק כשכבת התאמה חלשה,
// לעולם לא כבסיס להשוואת תחיליות (שם הוא היה יוצר התאמות שווא: אור↔ארון).
function skeleton(w){
  if(w.length <= 2) return w;
  let r = w[0];
  for(let i = 1; i < w.length; i++){ const ch = w[i]; if(ch !== 'י' && ch !== 'ו') r += ch; }
  return r;
}

// קבוצה סגורה של סיומות עבריות — הרחבת תחיליות מותרת רק אם השארית היא סיומת
// לגיטימית. זה מה שמונע "תפילה"→"תפילין" ו"סוד"→"סדר".
const SUFFIXES = new Set([
  '','ה','ת','י','ו','כ','נ','מ',
  'ימ','ות','יות','ינ','אות','תא','אי','אה',
  'ני','נו','נה','נמ','כמ','כנ','המ','הנ','יו','יה','יכ','ינו','יני',
  'תי','תמ','תנ','תו','תה','תכ','ית','יתא',
  'ותי','ותיו','ותיה','ותינו','ותיכמ','יהמ','יהנ','ותמ','ותנ'
]);
const PREFIXES = ['ו','ב','ל','ה','מ','ש','כ','וב','ול','וה','ומ','וש','וכ','מה','שה','כש','לה','בה','כה','מש','שב','ומה','וכש','ולה','שכ','לכש'];
// ─── קיצורים מקובלים בפנימיות התורה: קיצור (בלי גרשיים) → הצורה המלאה ───
// מאפשר שגם "א\"א" וגם "אריך אנפין" יובילו לאותו ערך.
const ABBREV_EXPAND = {
  'אא': 'אריך אנפין',        'זא': 'זעיר אנפין',
  'עק': 'עתיק יומין',        'זון': 'זעיר אנפין ונוקבא',
  'ביע': 'בריאה יצירה עשייה', 'אק': 'אדם קדמון',
  'אס': 'אין סוף',           'אאס': 'אור אין סוף',
  'עח': 'עץ חיים',           'נרנחי': 'נפש רוח נשמה חיה יחידה',
  'נרנ': 'נפש רוח נשמה',      'נשי': 'נשמה חיה יחידה',
  'תושבכ': 'תורה שבכתב',      'תושבע': 'תורה שבעל פה',
  'אנכ': 'אורות ניצוצות כלים', 'חבד': 'חכמה בינה דעת',
  'חגת': 'חסד גבורה תפארת',   'מן': 'מוחין דנוקבא',
  'נהי': 'נצח הוד יסוד',      'קבה': 'הקדוש ברוך הוא',
  'עמי': 'עם ישראל',          'כנסי': 'כנסת ישראל',
  'עוהז': 'עולם הזה',         'עוהב': 'עולם הבא',
  'מת': 'מתן תורה',           'אדהר': 'אדם הראשון'
};

const STOPWORDS = new Set(['של','את','הוא','היא','זה','זו','על','אל','כי','אמ','לא','גמ','או','כמו','אשר','עמ','אבל','רק','כל','יש']);

const Q_EXACT=1.00, Q_SUFFIX=0.88, Q_PREFIXED=0.80, Q_PRE_SUF=0.72, Q_STEMCUT=0.60, Q_SKEL=0.52;
const STRONG_MATCH = 0.72;   // מכאן ומעלה נחשב "התאמה חזקה" לצורך דירוג
const PROX_TOPK = 120;       // כמה מועמדים מקבלים ניתוח קרבה מלא
// מרחק מקסימלי בין שתי מילות חיפוש עוקבות: עד 5 מילים ביניהן.
// שאילתה רבת-מילים שמילותיה מפוזרות רחוק מזו לא נחשבת התאמה בכלל —
// זה מה שמונע תוצאה שנראית שגויה למרות שהמילים "קיימות" בערך.
const MAX_WORD_GAP = 5;

// ─── בניית אינדקס (ניתנת לפיצול למנות כדי לא לתקוע את הדפדפן) ───
function createIndexBuilder(items){
  const abbrev = new Set();   // טוקנים שמקורם בקיצור עם גרשיים
  const vocab = new Map(), vocabList = [], docs = [];
  let at = 0;
  function intern(tok){
    let id = vocab.get(tok);
    if(id === undefined){ id = vocabList.length; vocab.set(tok, id); vocabList.push(tok); }
    return id;
  }
  return {
    total: items.length,
    get position(){ return at; },
    step(count){
      const end = Math.min(items.length, at + count);
      for(; at < end; at++){
        const e = items[at];
        const tf = [];
        const titleToks = tokenize(e.t, tf);
        const title = titleToks.map(intern);
        for(let k = 0; k < titleToks.length; k++) if(tf[k]) abbrev.add(titleToks[k]);
        const defs = (e.d || []).map(txt => {
          const df = [];
          const dt = tokenize(txt, df);
          for(let k = 0; k < dt.length; k++) if(df[k]) abbrev.add(dt[k]);
          return dt.map(intern);
        });
        let len = title.length;
        for(const ds of defs) len += ds.length;
        docs.push({ title: title, defs: defs, len: len || 1, titleLen: title.length || 1 });
      }
      return at >= items.length;
    },
    finish(){
      const nV = vocabList.length, nD = docs.length;
      const tfTitle = new Array(nV), tfBody = new Array(nV);
      for(let i = 0; i < nV; i++){ tfTitle[i] = []; tfBody[i] = []; }
      // טכניקת "המסמך האחרון שנראה" — חוסכת הקצאת Map לכל מסמך
      const lastT = new Int32Array(nV).fill(-1), lastB = new Int32Array(nV).fill(-1);
      for(let d = 0; d < nD; d++){
        const doc = docs[d];
        for(const id of doc.title){
          const arr = tfTitle[id];
          if(lastT[id] !== d){ lastT[id] = d; arr.push(d, 1); } else arr[arr.length-1]++;
        }
        for(const ds of doc.defs) for(const id of ds){
          const arr = tfBody[id];
          if(lastB[id] !== d){ lastB[id] = d; arr.push(d, 1); } else arr[arr.length-1]++;
        }
      }
      const skelMap = new Map();
      for(let id = 0; id < nV; id++){
        const sk = skeleton(vocabList[id]);
        let a = skelMap.get(sk); if(!a) skelMap.set(sk, a = []); a.push(id);
      }
      const sortedIds = vocabList.map((_, i) => i)
        .sort((a, b) => vocabList[a] < vocabList[b] ? -1 : vocabList[a] > vocabList[b] ? 1 : 0);
      const sortedTokens = sortedIds.map(i => vocabList[i]);
      let sum = 0; for(const d of docs) sum += d.len;
      return { vocab, vocabList, skelMap, tfTitle, tfBody, docs, sortedTokens, sortedIds,
               abbrev: abbrev, avgLen: sum / (nD || 1), nDocs: nD };
    }
  };
}
function buildIndexSync(items){
  const b = createIndexBuilder(items);
  while(!b.step(2000));
  return b.finish();
}

function prefixRange(ix, w, cb){
  const st = ix.sortedTokens, si = ix.sortedIds;
  let lo = 0, hi = st.length;
  while(lo < hi){ const m = (lo + hi) >> 1; if(st[m] < w) lo = m + 1; else hi = m; }
  for(let i = lo; i < st.length && st[i].startsWith(w); i++) cb(si[i], st[i]);
}

// מילת חיפוש → Map(tokenId → איכות ההתאמה 0..1)
function resolveWord(ix, w, exactOnly){
  const q = new Map();
  function bump(id, v){ const c = q.get(id); if(c === undefined || c < v) q.set(id, v); }
  const ex = ix.vocab.get(w);
  if(ex !== undefined) bump(ex, Q_EXACT);
  if(w.length < 2) return q;                      // אות בודדת: התאמה מדויקת בלבד
  // המשתמש הקליד גרשיים => זה קיצור. הרחבה מורפולוגית על גזע של 2-3 אותיות
  // הייתה גורפת חצי מהמילון, ולכן קיצור מותאם בדיוק בלבד.
  // הדגל בא מהשאילתה ולא מאוצר-המילים: "אור" מופיע גם כקיצור בקורפוס,
  // ואסור שזה ימנע ממנו למצוא "אורות".
  if(exactOnly && w.length <= 4) return q;
  prefixRange(ix, w, (id, tok) => { if(tok !== w && SUFFIXES.has(tok.slice(w.length))) bump(id, Q_SUFFIX); });
  for(const p of PREFIXES){
    const pw = p + w;
    prefixRange(ix, pw, (id, tok) => {
      const rest = tok.slice(pw.length);
      if(SUFFIXES.has(rest)) bump(id, rest ? Q_PRE_SUF : Q_PREFIXED);
    });
  }
  if(w.length >= 4 && (w.endsWith('ה') || w.endsWith('ת') || w.endsWith('י'))){
    const stem = w.slice(0, -1);
    prefixRange(ix, stem, (id, tok) => { if(SUFFIXES.has(tok.slice(stem.length))) bump(id, Q_STEMCUT); });
  }
  if(w.length >= 3){
    const ids = ix.skelMap.get(skeleton(w));
    if(ids) for(const id of ids) bump(id, Q_SKEL);
  }
  return q;
}

// ─── תיקון שגיאת כתיב: מחזיר את מילת האוצר הקרובה ביותר במרחק עריכה 1 ───
// עלות: ~28*len בדיקות Map. רץ רק כשאין תוצאות בכלל.
const HEB_LETTERS = 'אבגדהוזחטיכלמנסעפצקרשת';
function fuzzyFix(ix, w){
  if(w.length < 3) return w;
  if(ix.vocab.has(w)) return w;
  let best = null, bestDf = 0;
  const consider = cand => {
    if(cand === w || cand.length < 2) return;
    const id = ix.vocab.get(cand);
    if(id === undefined) return;
    // העדף את המילה הנפוצה יותר — סביר יותר שזו הכוונה
    const df = (ix.tfTitle[id].length >> 1) * 8 + (ix.tfBody[id].length >> 1);
    if(df > bestDf){ bestDf = df; best = cand; }
  };
  for(let i = 0; i < w.length; i++) consider(w.slice(0, i) + w.slice(i + 1));          // מחיקה
  for(let i = 0; i < w.length; i++)
    for(const ch of HEB_LETTERS) if(ch !== w[i]) consider(w.slice(0, i) + ch + w.slice(i + 1));  // החלפה
  for(let i = 1; i <= w.length; i++)
    for(const ch of HEB_LETTERS) consider(w.slice(0, i) + ch + w.slice(i));            // הוספה
  for(let i = 0; i + 1 < w.length; i++)                                                // החלפת סדר
    consider(w.slice(0, i) + w[i+1] + w[i] + w.slice(i + 2));
  return best || w;
}

// מחזיר את המרחק הקטן ביותר בין המילה הראשונה לאחרונה ברצף תקין,
// או -1 אם אין רצף שבו כל שתי מילים עוקבות במרחק של עד MAX_WORD_GAP מילים.
function orderedSpan(lists){
  const n = lists.length;
  if(n === 1) return lists[0].length ? 0 : -1;
  const maxStep = MAX_WORD_GAP + 1;
  let best = Infinity;
  for(const start of lists[0]){
    let prev = start, ok = true;
    for(let w = 1; w < n; w++){
      const arr = lists[w]; let found = -1;
      // המילה הבאה חייבת להיות אחרי הקודמת *ובתוך* מרחק המילים המותר
      for(let k = 0; k < arr.length; k++){
        if(arr[k] > prev && arr[k] - prev <= maxStep){ found = arr[k]; break; }
      }
      if(found === -1){ ok = false; break; }
      prev = found;
    }
    if(ok && prev - start < best) best = prev - start;
  }
  return best === Infinity ? -1 : best;
}
// ממלא את מערכי המיקומים של *כל* מילות החיפוש בסריקה אחת של הזרם.
// קודם נעשו N סריקות נפרדות לכל הגדרה — צוואר בקבוק מרגע שהקרבה הפכה
// לתנאי סינון שנבדק לכל מועמד ולא רק ל-120 הראשונים.
// מחזיר null אם חסרה מילה, כדי לדלג על חישוב הקרבה כליל.
function posInMulti(stream, resolved){
  const n = resolved.length;
  const out = new Array(n);
  for(let w = 0; w < n; w++) out[w] = [];
  for(let i = 0; i < stream.length; i++){
    const id = stream[i];
    for(let w = 0; w < n; w++) if(resolved[w].qmap.has(id)) out[w].push(i);
  }
  for(let w = 0; w < n; w++) if(!out[w].length) return null;
  return out;
}
function posIn(stream, qmap){
  const p = [];
  for(let i = 0; i < stream.length; i++) if(qmap.has(stream[i])) p.push(i);
  return p;
}

function runSearchPass(ix, resolved, titleOnly){
  const N = resolved.length, nD = ix.nDocs;
  const tQ = new Float64Array(nD), bQ = new Float64Array(nD);
  const tMin = new Float64Array(nD).fill(1), bMin = new Float64Array(nD).fill(1);
  const tCov = new Uint8Array(nD), bCov = new Uint8Array(nD);
  const touched = new Set();
  for(let wi = 0; wi < N; wi++){
    const qmap = resolved[wi].qmap;
    const bt = new Map(), bb = new Map();
    for(const pair of qmap){
      const id = pair[0], qv = pair[1];
      const pt = ix.tfTitle[id];
      for(let k = 0; k < pt.length; k += 2){
        const d = pt[k], sc = qv * (1 + Math.log(1 + pt[k+1]) * 0.3);
        const cur = bt.get(d);
        if(cur === undefined) bt.set(d, [qv, sc]);
        else { if(cur[0] < qv) cur[0] = qv; if(cur[1] < sc) cur[1] = sc; }
      }
      if(!titleOnly){
        const pb = ix.tfBody[id];
        for(let k = 0; k < pb.length; k += 2){
          const d = pb[k], sc = qv * (1 + Math.log(1 + pb[k+1]) * 0.3);
          const cur = bb.get(d);
          if(cur === undefined) bb.set(d, [qv, sc]);
          else { if(cur[0] < qv) cur[0] = qv; if(cur[1] < sc) cur[1] = sc; }
        }
      }
    }
    for(const kv of bt){ const d = kv[0], v = kv[1]; tCov[d]++; tQ[d] += v[1]; if(v[0] < tMin[d]) tMin[d] = v[0]; touched.add(d); }
    for(const kv of bb){ const d = kv[0], v = kv[1]; bCov[d]++; bQ[d] += v[1]; if(v[0] < bMin[d]) bMin[d] = v[0]; touched.add(d); }
  }
  const pre = [];
  for(const d of touched){
    const tFull = tCov[d] === N, bFull = bCov[d] === N;
    if(!tFull && !bFull) continue;
    const doc = ix.docs[d];
    const focus = tFull ? (N / doc.titleLen) * tMin[d] : 0;
    const lenNorm = 1 / (1 + Math.log(1 + doc.len / ix.avgLen));
    pre.push({ d: d, tFull: tFull, bFull: bFull,
               tMin: tFull ? tMin[d] : 0, bMin: bFull ? bMin[d] : 0,
               base: tQ[d] * 14 + focus * 45 + (bFull ? bQ[d] * 1.5 * lenNorm : 0) });
  }
  pre.sort((a, b) => b.base - a.base);
  const out = [];
  for(let i = 0; i < pre.length; i++){
    const p = pre[i], doc = ix.docs[p.d];
    let tSpan = -1, bSpan = -1;
    if(N === 1){
      tSpan = p.tFull ? 0 : -1;
      bSpan = p.bFull ? 0 : -1;
    }else{
      // רב-מילים: הקרבה היא תנאי סינון, ולכן נחשבת לכל מועמד ולא רק ל-120
      // הראשונים. קבוצת המועמדים אחרי חיתוך AND קטנה, כך שזה זול.
      if(p.tFull){
        const tl = posInMulti(doc.title, resolved);
        if(tl) tSpan = orderedSpan(tl);
      }
      if(p.bFull){
        for(let di = 0; di < doc.defs.length; di++){
          const lists = posInMulti(doc.defs[di], resolved);
          if(!lists) continue;
          const s = orderedSpan(lists);
          if(s >= 0 && (bSpan < 0 || s < bSpan)){
            bSpan = s;
            if(bSpan === N - 1) break;   // צמוד — אין מה לשפר
          }
        }
      }
      // אף מופע לא עמד במרחק המותר — לא תוצאה.
      if(tSpan < 0 && bSpan < 0) continue;
    }
    const tStrong = p.tMin >= STRONG_MATCH, bStrong = p.bMin >= STRONG_MATCH;
    let tier;
    if(p.tFull && tStrong && tSpan === N-1)      tier = 0;   // כל המילים בכותרת, צמודות
    else if(p.tFull && tStrong && tSpan >= 0)    tier = 1;   // בכותרת, לפי הסדר
    else if(p.tFull && tStrong)                  tier = 2;   // בכותרת
    else if(p.tFull)                             tier = 3;   // בכותרת אך התאמה חלשה
    else if(p.bFull && bStrong && bSpan === N-1) tier = 4;   // צמודות בהגדרה אחת
    else if(p.bFull && bStrong && bSpan >= 0)    tier = 5;   // בהגדרה אחת, במרחק מותר
    else                                         tier = 6;   // התאמה חלשה בגוף
    const prox = (tSpan >= 0 ? (N-1)/(1+tSpan) : 0) * 12 + (bSpan >= 0 ? (N-1)/(1+bSpan) : 0) * 4;
    out.push({ ei: p.d, tier: tier, score: p.base + prox });
  }
  return out;
}

// חיפוש ראשי. מחזיר { results:[{ei,tier,score}], words, resolved, note }
function runEngine(ix, rawQuery, alsoContent){
  const qFlags = [];
  const all = tokenize(rawQuery, qFlags);
  // מילים שהוקלדו עם גרשיים — יטופלו כקיצור (התאמה מדויקת)
  const typedAbbrev = new Set();
  for(let i = 0; i < all.length; i++) if(qFlags[i]) typedAbbrev.add(all[i]);
  if(!all.length) return { results: [], words: [], resolved: [], note: null };
  let words = all.filter(w => !STOPWORDS.has(w));
  if(!words.length) words = all;
  words = words.slice(0, 8);
  const titleOnly = !alsoContent || words.every(w => w.length < 2);

  // ניסוחים חלופיים: איחוד מילים סמוכות ("אין סוף" → "אינסוף")
  const variants = [words];
  if(words.length > 1 && words.length <= 5){
    for(let i = 0; i < words.length - 1; i++){
      if(ix.vocab.has(words[i] + words[i+1])){
        variants.push(words.slice(0, i).concat(words[i] + words[i+1], words.slice(i+2)));
      }
    }
    if(words.length > 2 && ix.vocab.has(words.join(''))) variants.push([words.join('')]);
  }
  // קיצור → צורה מלאה, ולהיפך. "א\"א" יביא גם את "אריך אנפין".
  for(const w of words){
    const full = ABBREV_EXPAND[w];
    if(!full) continue;
    const fullToks = tokenize(full);
    if(!fullToks.length) continue;
    variants.push(words.length === 1 ? fullToks
                                    : words.map(x => x === w ? fullToks : [x]).flat());
  }

  const merged = new Map();
  let firstResolved = null, missing = [];
  for(const wl of variants.slice(0, 4)){
    const resolved = [], miss = [];
    for(const w of wl){
      const qmap = resolveWord(ix, w, typedAbbrev.has(w));
      if(qmap.size) resolved.push({ w: w, qmap: qmap }); else miss.push(w);
    }
    if(!resolved.length) continue;
    if(!firstResolved){ firstResolved = resolved; missing = miss; }
    for(const r of runSearchPass(ix, resolved, titleOnly)){
      const cur = merged.get(r.ei);
      if(!cur || r.tier < cur.tier || (r.tier === cur.tier && r.score > cur.score)) merged.set(r.ei, r);
    }
  }
  // ── מפלט אחרון: תיקון שגיאת כתיב במרחק עריכה 1 ──
  // רץ *רק* כששום דבר לא נמצא, כדי שלא יפגע בדיוק של חיפוש תקין.
  if(!merged.size){
    const fixed = words.map(w => fuzzyFix(ix, w));
    if(fixed.some((f, i) => f !== words[i])){
      const resolved = [];
      for(const w of fixed){
        const qmap = resolveWord(ix, w, typedAbbrev.has(w));
        if(qmap.size) resolved.push({ w: w, qmap: qmap });
      }
      if(resolved.length){
        for(const r of runSearchPass(ix, resolved, titleOnly)) merged.set(r.ei, r);
        if(merged.size){
          const res = Array.from(merged.values())
            .sort((a, b) => a.tier !== b.tier ? a.tier - b.tier : b.score - a.score);
          return { results: res, words: fixed, resolved: resolved,
                   note: 'didyoumean:' + fixed.join(' ') };
        }
      }
    }
  }
  if(!merged.size){
    // כל המילים קיימות במילון, אבל לא נמצאו יחד במרחק המותר —
    // זה מצב שונה מ"אין כזו מילה", וכדאי להסביר אותו למשתמש.
    const allResolve = firstResolved && firstResolved.length === words.length;
    return { results: [], words: words, resolved: firstResolved || [],
             note: (words.length > 1 && allResolve) ? 'toofar' : 'none' };
  }
  const results = Array.from(merged.values())
    .sort((a, b) => a.tier !== b.tier ? a.tier - b.tier : b.score - a.score);
  return { results: results, words: words, resolved: firstResolved,
           note: missing.length ? 'missing' : null };
}

// איזו הגדרה התאימה + היכן — מחושב רק עבור התוצאות המוצגות בפועל
function bestDefinitionFor(ix, ei, resolved){
  const doc = ix.docs[ei];
  let best = -1, bestScore = 0, bestPos = 0;
  for(let di = 0; di < doc.defs.length; di++){
    const stream = doc.defs[di];
    let cov = 0, q = 0, first = -1;
    for(const r of resolved){
      let hit = 0, p = -1;
      for(let i = 0; i < stream.length; i++){
        const v = r.qmap.get(stream[i]);
        if(v !== undefined){ if(v > hit) hit = v; if(p < 0) p = i; }
      }
      if(hit > 0){ cov++; q += hit; if(first < 0 || (p >= 0 && p < first)) first = p; }
    }
    if(!cov) continue;
    // כיסוי מלא של כל מילות החיפוש בהגדרה אחת שווה יותר מסכום איכויות גבוה
    const full = cov === resolved.length ? 3 : 1;
    const s = q * cov * full;
    if(s > bestScore){ bestScore = s; best = di; bestPos = first < 0 ? 0 : first; }
  }
  return { defIdx: best, tokenPos: bestPos };
}

// ─── אינדקס כותרות מיידי (זמין מיד מ-terms.json, לפני שהאינדקס המלא ירד) ───
let titleIx = null, titleList = null;
function buildTitleIndex(){
  if(titleIx || !data) return;
  titleList = [];
  for(const t of data.topics){
    for(const e of t.entries) titleList.push({ id: e.id, t: e.term, topicTitle: t.title, d: [] });
  }
  titleIx = buildIndexSync(titleList);
}
function searchTitlesOnly(rawQuery){
  if(!titleIx) return [];
  const r = runEngine(titleIx, rawQuery, false);
  return r.results.map(x => ({
    id: titleList[x.ei].id, term: titleList[x.ei].t,
    topicTitle: titleList[x.ei].topicTitle, tier: x.tier, matchedDefIdx: -1
  }));
}

// ─── IndexedDB: שמירת ה-JSON המפוענח, כדי לחסוך הורדה + פענוח בביקור חוזר ───
const IDB_NAME = 'milon-cache';
const IDB_STORE = 'data';
const IDB_KEY = 'search-payload';
const CACHE_STAMP = DATA_VERSION + '|' + INDEX_CODE_VERSION;

function idbOpen(){
  return new Promise((resolve, reject) => {
    let req;
    try{ req = indexedDB.open(IDB_NAME, 1); }catch(e){ reject(e); return; }
    req.onupgradeneeded = () => { try{ req.result.createObjectStore(IDB_STORE); }catch(e){} };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('idb blocked'));
  });
}
function idbGet(db, key){
  return new Promise((resolve, reject) => {
    try{
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    }catch(e){ reject(e); }
  });
}
function idbPut(db, key, val){
  return new Promise((resolve, reject) => {
    try{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      const req = tx.objectStore(IDB_STORE).put(val, key);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    }catch(e){ reject(e); }
  });
}

// ─── טעינה + בנייה של האינדקס המלא ───
let searchIndexPromise = null;
let searchIndexFailed  = false;

function ensureSearchIndex(){
  if(searchIx) return Promise.resolve(searchIx);
  if(searchIndexPromise) return searchIndexPromise;
  searchIndexPromise = (async () => {
    let payload = null;
    let db = null;
    try{ db = await idbOpen(); }catch(e){ db = null; }
    if(db){
      try{
        const cached = await idbGet(db, IDB_KEY);
        if(cached && cached.stamp === CACHE_STAMP && cached.payload) payload = cached.payload;
      }catch(e){ /* קאש פגום — נמשיך לרשת */ }
    }
    if(!payload){
      const res = await fetch(SEARCH_URL);
      if(!res.ok) throw new Error('טעינת אינדקס החיפוש נכשלה (' + res.status + ')');
      payload = await res.json();
      if(db) idbPut(db, IDB_KEY, { stamp: CACHE_STAMP, payload: payload }).catch(() => {});
    }
    searchData = payload;
    searchById = {};
    payload.entries.forEach((e, i) => { searchById[e.i] = { entry: e, idx: i }; });
    await buildIndexInSlices(payload.entries);
    return searchIx;
  })().catch(err => {
    console.error('search index failed:', err);
    searchIndexFailed = true;
    searchIndexPromise = null;
    onSearchIndexFailed(err);
    throw err;
  });
  return searchIndexPromise;
}

// בונה את האינדקס במנות קטנות כדי שהדפדפן לא ייתקע בזמן הבנייה
function buildIndexInSlices(items){
  return new Promise(resolve => {
    const builder = createIndexBuilder(items);
    const schedule = (typeof window.requestIdleCallback === 'function')
      ? (fn => window.requestIdleCallback(fn, { timeout: 250 }))
      : (fn => setTimeout(fn, 0));
    function pump(){
      const t0 = performance.now();
      let done = false;
      // מנות של 25 ערכים עד שנצברו ~8ms — שומר על פריימים חלקים
      while(!done && performance.now() - t0 < 8) done = builder.step(25);
      if(done){
        searchIx = builder.finish();
        resolve(searchIx);
        onSearchIndexReady();
      }else{
        schedule(pump);
      }
    }
    schedule(pump);
  });
}

function onSearchIndexReady(){
  // הרצה מחדש רק אם המשתמש באמת נמצא במסך תוצאות חיפוש —
  // לפני התיקון זה היה חוטף את המסך גם אם המשתמש כבר פתח ערך.
  const inp = document.getElementById('search');
  const q = inp ? inp.value.trim() : '';
  if(q && currentSearchQuery && !currentEntry && currentPage === 'dictionary') runSearch(q);
}
function onSearchIndexFailed(err){
  if(!currentSearchQuery) return;
  fadeContent('<div class="search-no-results">' +
    'לא ניתן לחפש בתוכן ההגדרות כרגע.<br/>' +
    '<span style="font-size:0.85em;color:var(--ink-faint)">' + escapeHtml(err.message || '') + '</span><br/>' +
    '<button class="search-pg-btn" style="margin-top:14px;width:auto;padding:6px 18px" onclick="retrySearchIndex()">נסה שוב</button>' +
    '</div>');
}
window.retrySearchIndex = function(){
  searchIndexFailed = false;
  ensureSearchIndex().catch(() => {});
  if(currentSearchQuery) runSearch(currentSearchQuery);
};

async function load(){
  try{
    const res = await fetch(TERMS_URL + (DATA_VERSION ? '?v=' + DATA_VERSION : ''));
    if(!res.ok) throw new Error('טעינת רשימת הערכים נכשלה (' + res.status + ')');
    data = await res.json();
  }catch(err){
    console.error('load() failed:', err);
    document.getElementById('content').innerHTML =
      '<div class="info-page"><h1 class="info-title">שגיאה בטעינת המילון</h1>' +
      '<p style="color:var(--ink-faint);text-align:center">' + escapeHtml(err.message || '') + '</p>' +
      '<p style="text-align:center;margin-top:18px"><button class="search-pg-btn" style="width:auto;padding:6px 18px" onclick="location.reload()">רענן</button></p></div>';
    return;
  }
  renderNav();
  buildTitleIndex();   // חיפוש כותרות עובד מיד

  if(data.topics.length){
    currentTopic = data.topics[0].id;
    const firstTopic = document.querySelector('.topic');
    const firstHead  = document.querySelector('.topic-head');
    if(firstTopic) firstTopic.classList.add('open');
    if(firstHead){ firstHead.classList.add('active'); firstHead.setAttribute('aria-expanded','true'); }
    // אם נשמרו לשוניות מהפעם הקודמת — משחזרים אותן במקום לנחות על המדור הראשון
    if(!restoreTabs()){
      renderTopicLanding(data.topics[0], 0);
      // מסך הפתיחה עצמו הוא לשונית — בלי זה הלשונית הראשונה נוצרת רק בניווט הראשון
      touchTab({ k: 'topic', t: data.topics[0].id });
    }
  }
  ensureSearchIndex().catch(() => {});
}

function renderNav(){

    <div class="topic" data-topic="${escapeHtml(t.id)}">
      <div class="topic-head" role="button" tabindex="0" aria-expanded="false"

// מלבד escapeHtml — גם גרש בודד חייב בריחה, כי הוא סוגר את מחרוזת ה-onclick
function escapeAttr(s){ return escapeHtml(s).replace(/'/g, '&#39;'); }

function selectTopic(id){
  const ti = data.topics.findIndex(t => t.id === id);
  const topic = data.topics[ti];
  const wasOpen = document.querySelector(`.topic[data-topic="${id}"]`).classList.contains('open');
  document.querySelectorAll('.topic').forEach(el => {
    const open = el.dataset.topic === id ? !wasOpen : false;
    el.classList.toggle('open', open);
    const head = el.querySelector('.topic-head');
    head.classList.toggle('active', el.dataset.topic === id);
    head.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.querySelectorAll('.entry-link').forEach(el => el.classList.remove('active'));
  currentTopic = id;
  currentEntry = null;
  pushNav({ k: 'topic', t: id });
  renderTopicLanding(topic, ti);
}

// ─── Prefetch בלי להציג; משמש ל-hover/related/neighbors ───
window.prefetchEntry = function(id){
  if(!id || entryCache.has(id)) return;
  loadEntry(id).catch(() => {});  // שתיקה — אם נכשל, ייטען בלחיצה
};

// קדם-טען את הערכים הסמוכים (לפני/אחרי) ואת הקשורים
function prefetchNeighbors(topicId, ei){
  const topic = data.topics.find(t => t.id === topicId);
  if(!topic) return;
  // הקודם והבא ברשימה
  if(ei > 0) prefetchEntry(topic.entries[ei-1].id);
  if(ei < topic.entries.length-1) prefetchEntry(topic.entries[ei+1].id);
  // קשורים — נטענים בעצלתיים מהערך עצמו אם ה-DOM כבר נבנה
  // (window.requestIdleCallback — לא מזהה חשוף; Safari מתחת ל-16.4 זורק ReferenceError)
  if(typeof window.requestIdleCallback === 'function'){
    window.requestIdleCallback(prefetchRelatedFromDom, {timeout: 2000});
  }else{
    setTimeout(prefetchRelatedFromDom, 500);
  }
}
function prefetchRelatedFromDom(){
  document.querySelectorAll('.related-link[data-entry]').forEach(el => {
    prefetchEntry(el.dataset.entry);
  });
}

async function goToEntry(topicId, entryId){
  // במובייל — סגור את המגירה ברגע שנבחר ערך
  if(typeof setNavOpen === 'function') setNavOpen(false);
  // עדכן סרגל
  if(currentTopic !== topicId){
    document.querySelectorAll('.topic').forEach(el => {
      el.classList.toggle('open', el.dataset.topic === topicId);
      el.querySelector('.topic-head').classList.toggle('active', el.dataset.topic === topicId);
    });
  }else{
    document.querySelector(`.topic[data-topic="${topicId}"]`).classList.add('open');
  }
  currentTopic = topicId;
  currentEntry = entryId;
  pushNav({ k: 'entry', t: topicId, e: entryId });
  document.querySelectorAll('.entry-link').forEach(el => {
    el.classList.toggle('active', el.dataset.entry === entryId);
  });

  // טעינה אופטימית: אם הערך בקאש → רינדור מיידי בלי ספינר ובלי fade-in
  if(entryCache.has(entryId)){
    const entry = entryCache.get(entryId);
    const ti = data.topics.findIndex(t => t.id === topicId);
    const topic = data.topics[ti];
    const ei = topic.entries.findIndex(e => e.id === entryId);
    renderEntryPage(topic, ti, entry, ei);
    prefetchNeighbors(topicId, ei);
    return;
  }

  // ספינר מתעכב — אם הטעינה מהירה, לא יוצג כלל (מונע פליק)
  let spinnerShown = false;
  const spinnerTimer = setTimeout(() => {
    if(currentEntry !== entryId) return;
    spinnerShown = true;
    fadeContent(`<div class="spinner-wrap"><div class="spinner"></div><div class="spinner-text">טוען…</div></div>`);
  }, 90);

  try{
    const entry = await loadEntry(entryId);
    clearTimeout(spinnerTimer);
    if(currentEntry !== entryId) return;
    const ti = data.topics.findIndex(t => t.id === topicId);
    const topic = data.topics[ti];
    const ei = topic.entries.findIndex(e => e.id === entryId);
    renderEntryPage(topic, ti, entry, ei);
    prefetchNeighbors(topicId, ei);   // קדם-טען את הסמוכים
  }catch(err){
    clearTimeout(spinnerTimer);
    console.error('Failed to load entry:', err);
    if(currentEntry === entryId){
      fadeContent(`<div class="info-page"><h1 class="info-title">שגיאה בטעינת הערך</h1><p style="color:var(--ink-faint);">${escapeHtml(err.message)}</p></div>`);
    }
  }
}

// ─── הדגשת מילות חיפוש בגוף הערך + גלילה למיקום הראשון ───
function highlightSearchInPage(query){
  const content = document.getElementById('content');
  if(!content || !query) return;
  const ix = searchIx || titleIx;
  if(!ix) return;
  const r = runEngine(ix, query, false);
  const marks = collectMatchTokens(ix, r.resolved);
  if(!marks.size) return;

  const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, null);
  const textNodes = [];
  let node;
  while((node = walker.nextNode())){
    const tag = node.parentElement && node.parentElement.tagName;
    if(tag === 'SCRIPT' || tag === 'STYLE' || tag === 'MARK') continue;
    if(node.textContent.trim()) textNodes.push(node);
  }

  for(const tn of textNodes){
    const text = tn.textContent;
    const toks = tokenizeWithPos(text);
    let any = false;
    for(const t of toks) if(marks.has(t.tok)){ any = true; break; }
    if(!any) continue;
    const frag = document.createDocumentFragment();
    let last = 0;
    for(const t of toks){
      if(!marks.has(t.tok)) continue;
      if(t.start > last) frag.appendChild(document.createTextNode(text.slice(last, t.start)));
      const mark = document.createElement('mark');
      mark.className = 'search-hl-mark';
      mark.textContent = text.slice(t.start, t.end);
      frag.appendChild(mark);
      last = t.end;
    }
    if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    tn.parentNode.replaceChild(frag, tn);
  }

  clearTimeout(_hlScrollTimer);
  _hlScrollTimer = setTimeout(() => {
    const first = content.querySelector('mark.search-hl-mark');
    if(first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 120);
}
let _hlScrollTimer = null;

                  aria-label="${isBookmarked(entry.id) ? 'הסר מהסימניות' : 'הוסף לסימניות'}">

          </button>
        </h1>
        <div class="entry-topic-label">${escapeHtml(topic.title)} · ${escapeHtml(topic.subtitle)}</div>
      </header>
      ${entry.definitions.map((d, i) => {
        // אם הטקסט מתחיל ב-[ (הפניה / הערה) — לא נחיל את ה-drop-cap האדום

function findEntry(id){
  for(const t of data.topics){
    const e = t.entries.find(x => x.id === id);
